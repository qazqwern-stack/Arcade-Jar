<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048 / MATERIALS — Arcade Jar</title><meta name="theme-color" content="#193e39"><script src="../../hub-sdk.js"></script><style>body{margin:0;background:#dddcd7}</style></head><body>

#merge-materials .ml-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:18px}#merge-materials .ml-brand{font-size:10px;letter-spacing:2px;color:var(--muted)}#merge-materials .ml-index{font:12px ui-monospace,monospace;color:var(--muted)}#merge-materials h2{font-size:32px;line-height:1.05;letter-spacing:-1.1px;margin:4px 0 0;font-weight:650}#merge-materials .ml-sub{font-size:12px;color:var(--muted);margin:8px 0 0;min-height:34px;max-width:315px}#merge-materials .ml-stats{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:17px 0 13px;padding:11px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}#merge-materials .ml-stat{min-width:0}#merge-materials .ml-stat span{display:block;font-size:9px;letter-spacing:1.3px;color:var(--muted)}#merge-materials .ml-stat b{font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}#merge-materials .ml-material{max-width:45%;text-align:right;font-size:11px;color:var(--muted)}#merge-materials .ml-board{position:relative;aspect-ratio:1;background:var(--field)}#merge-materials canvas{display:block;width:100%;height:100%;touch-action:none}#merge-materials .ml-banner{position:absolute;inset:0;background:var(--bg);opacity:.97;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:25px;text-align:center;z-index:2}#merge-materials .ml-banner[hidden]{display:none}#merge-materials .ml-banner strong{font-size:25px;letter-spacing:-.5px;font-weight:500}#merge-materials .ml-banner button{width:100%}#merge-materials .ml-status{font-size:11px;color:var(--muted);min-height:38px;padding:10px 0 7px}#merge-materials button{font:inherit;background:var(--button);border:1px solid var(--line);border-radius:0;color:var(--ink);cursor:pointer;min-height:44px;padding:9px 10px}#merge-materials button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}#merge-materials button:hover{border-color:var(--accent)}#merge-materials button:active{transform:translateY(1px)}#merge-materials .ml-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}#merge-materials .ml-new{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}#merge-materials .ml-input{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:13px}#merge-materials .ml-settings{display:flex;flex-direction:column;gap:5px}#merge-materials label{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);min-height:21px}#merge-materials input{accent-color:var(--accent);margin:0}#merge-materials .ml-a11y{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#merge-materials [data-theme=bio] .ml-board{border-radius:50%;background:#d4e8dc}#merge-materials [data-theme=bio] button{border-radius:12px}#merge-materials [data-theme=bio] .ml-new{border-radius:24px}#merge-materials [data-theme=crystal] h2{letter-spacing:2px;font-size:29px}#merge-materials [data-theme=space] h2{letter-spacing:3px;font-size:28px}#merge-materials [data-theme=space] .ml-brand{color:#b8a1de}#merge-materials [data-theme=paper] h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-style:italic;font-size:40px}#merge-materials [data-theme=paper] .ml-stats{border-bottom-style:dashed}#merge-materials [data-theme=terminal] h2{font-size:28px;letter-spacing:-1px;text-shadow:0 0 12px #7dff9250}#merge-materials [data-theme=terminal] button{font-size:12px}#merge-materials [data-theme=terminal] .ml-board:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0,transparent 2px,#0000002e 3px,#0000002e 4px)}#merge-materials [data-theme=liquid] h2{font-weight:400;letter-spacing:3px}#merge-materials [data-theme=liquid] .ml-board{border-radius:20px;overflow:hidden}#merge-materials [data-theme=liquid] button{border-radius:4px}#merge-materials [data-theme=city] h2{font-weight:800;letter-spacing:-1.4px}#merge-materials [data-theme=thread] .ml-app{font-family:Georgia,serif}#merge-materials [data-theme=thread] h2{font-family:Georgia,serif;font-style:italic;font-weight:400;font-size:37px}#merge-materials [data-theme=thread] .ml-board{outline:1px dashed #b9a58d;outline-offset:-5px}#merge-materials [data-theme=thread] button{border-style:dashed;border-radius:5px}

#merge-materials .ml-skin select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#merge-materials .ml-settings label{min-height:44px;gap:7px;font-size:11px}
@media(max-width:480px){#merge-materials .ml-skin select{font-size:16px}}
#merge-materials>section{padding:0}
#merge-materials .ml-app{padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
#merge-materials .ml-top{margin-bottom:7px}#merge-materials .ml-sub{display:none}
#merge-materials h2{font-size:25px!important;margin-bottom:5px}
#merge-materials .ml-skin{margin-bottom:7px}#merge-materials .ml-stats{margin:8px 0;padding:7px 0}
#merge-materials .ml-status{min-height:29px;padding:6px 0}#merge-materials .ml-input{margin-top:4px}
#merge-materials .ml-settings label{min-height:34px}

</style>
<script>
(()=>{
'use strict';
const root=document.getElementById('merge-materials');
const themes={
 bio:{name:'Чашка Петри',title:'MITOSIS',sub:'Не складывай числа. Выращивай жизнь.',material:'Живая мембрана / колония',bg:'#d4e8dc',ink:'#164a41',accent:'#3d9f82',duration:390},
 crystal:{name:'Кристаллизация',title:'CRYSTAL',sub:'Давление. Срастание. Вспышка новой грани.',material:'От кварца до алмаза',bg:'#101d27',ink:'#ecfff6',accent:'#83e2d2',duration:310},
 space:{name:'Звёздная эволюция',title:'STARFORGE',sub:'Собери вселенную. Один коллапс за ход.',material:'Пыль → звезда → чёрная дыра',bg:'#090d20',ink:'#fff3eb',accent:'#d9a0ff',duration:430},
 paper:{name:'Оригами',title:'Fold / 2048',sub:'Больше слоёв. Меньше лишнего.',material:'Бумага и тень',bg:'#dfdcd3',ink:'#383933',accent:'#727268',duration:350},
 terminal:{name:'Ретро-терминал',title:'root@2048:~$',sub:'> merge blocks. keep the process alive_',material:'PHOSPHOR / 60 Hz',bg:'#07170f',ink:'#aaffba',accent:'#6fef96',duration:290},
 liquid:{name:'Жидкий металл',title:'MERCURY',sub:'Наклони поверхность. Почувствуй вес.',material:'Объём / поверхностное натяжение',bg:'#26333d',ink:'#f4e9d1',accent:'#d6e6e8',duration:510},
 city:{name:'Город',title:'BLOCK CITY',sub:'От первого дома до города, который не спит.',material:'Палатка → квартал → мегаполис',bg:'#d7dfcc',ink:'#24464b',accent:'#db936c',duration:340},
 thread:{name:'Вышивка',title:'Threads',sub:'Собирай узор. Стежок за стежком.',material:'Канва / плотность орнамента',bg:'#e7d5be',ink:'#6b3549',accent:'#b3627d',duration:390}
};
const keys=Object.keys(themes),showcase=[2,2,4,4,8,8,16,16,32,32,64,64,128,128,1024,1024];
let board=Array(16).fill(0),score=0,best=0,demo=false,selected=null,numbers=true,sound=false,animation=null,spawned=-1,spawnTime=0,queue=null,won=false,continued=false,over=false,time=0,last=0,activeKey='bio',notice='',noticeUntil=0,audio=null;
const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches||false;
let ready=false,submitted=false,elapsed=0,social=false,pending=Promise.resolve();
const saved=null;
function validBoard(a){return Array.isArray(a)&&a.length===16&&a.every(v=>Number.isInteger(v)&&v>=0&&v<=1048576&&(v===0||(v&(v-1))===0));}
if(saved?.v===1&&saved.game==='2048-materials'){if(validBoard(saved.board))board=saved.board.slice();score=Number.isFinite(saved.score)?Math.max(0,saved.score):0;best=Number.isFinite(saved.best)?Math.max(0,saved.best):0;demo=!!saved.demo;selected=keys.includes(saved.selected)?saved.selected:null;numbers=saved.numbers!==false;activeKey=keys.includes(saved.activeTheme)?saved.activeTheme:(selected||'bio');}
const apps={};
for(const [i,k] of keys.entries()){
 const app=root.querySelector('[data-theme="'+k+'"]'),t=themes[k];app.innerHTML='<div class="ml-top"><span class="ml-brand">ARCADE JAR / 2048</span><span class="ml-index">'+String(i+1).padStart(2,'0')+' / 08</span></div><label class="ml-skin"><span>ОФОРМЛЕНИЕ</span><select data-setting="theme" aria-label="Оформление игры">'+keys.map(key=>'<option value="'+key+'">'+themes[key].name+'</option>').join('')+'</select></label><h2>'+t.title+'</h2><div class="ml-sub">'+t.sub+'</div><div class="ml-stats"><div class="ml-stat"><span>СЧЁТ</span><b class="ml-score">ВИТРИНА</b></div><div class="ml-stat"><span>РЕКОРД</span><b class="ml-best">0</b></div><span class="ml-material">'+t.material+'</span></div><div class="ml-board"><canvas width="800" height="800" role="img" aria-label="Поле 2048, четыре на четыре"></canvas><div class="ml-banner" hidden></div><div class="ml-social" hidden></div></div><div class="ml-status" aria-live="polite"></div><div class="ml-actions"><button class="ml-new" data-do="new">Новая игра</button><button data-do="board">Рейтинг</button></div><div class="ml-input"><div class="ml-settings"><label><input type="checkbox" data-setting="numbers" '+(numbers?'checked':'')+'>Числа</label><label><input type="checkbox" data-setting="sound">Звук</label></div></div><button class="ml-exit" data-do="exit">В Arcade Jar</button>';
 const cv=app.querySelector('canvas'),ctx=cv.getContext('2d');apps[k]={app,cv,ctx};ctx.setTransform(2,0,0,2,0,0);
 let pointer=null;
 cv.addEventListener('pointerdown',e=>{if(e.isPrimary===false||pointer)return;e.preventDefault();cv.setPointerCapture(e.pointerId);pointer={x:e.clientX,y:e.clientY,id:e.pointerId};});
 cv.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;pointer=null;if(Math.max(Math.abs(dx),Math.abs(dy))<16)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up');});
 const cancel=e=>{if(pointer&&pointer.id===e.pointerId)pointer=null;};cv.addEventListener('pointercancel',cancel);cv.addEventListener('lostpointercapture',cancel);
}
function setTheme(k,persist=true){if(!keys.includes(k))return;activeKey=k;for(const key of keys)apps[key].app.parentElement.hidden=key!==k;sync();render(k,performance.now());if(persist)remember();}
function current(){const visible=keys.find(k=>!apps[k].app.parentElement.hidden);return visible||activeKey;}
function serial(task){pending=pending.catch(e=>console.warn('2048 queued save',e)).then(task);return pending;}
function snapshot(){return ready&&!demo?{v:1,board:board.slice(),score,elapsed,won,continued,over,submitted}:null;}
function remember(){
 if(animation||!ready)return;
 const data={profile:{best,theme:activeKey,numbers},run:snapshot()};
 try{localStorage.setItem('merge2048_state',JSON.stringify(data));}catch(e){}
 return serial(()=>Hub.save(data));
}
function checkpoint(){if(animation){queue=null;finish();}else remember();}
function completeRound(){
 if(!ready||demo||submitted||score<=0)return;submitted=true;
 const run={score:Math.floor(score),duration:Math.round(elapsed)};
 serial(()=>Hub.submitRun(run));
}
function validRun(s){return !!(s&&s.v===1&&validBoard(s.board)&&s.board.some(Boolean)&&Number.isFinite(s.score)&&s.score>=0&&Number.isFinite(s.elapsed)&&s.elapsed>=0);}
function closeSocial(){social=false;for(const k of keys)apps[k].app.querySelector('.ml-social').hidden=true;}
async function showBoard(){
 if(!ready)return;checkpoint();social=true;
 for(const k of keys){const el=apps[k].app.querySelector('.ml-social');el.hidden=false;el.innerHTML='<strong>Рейтинг</strong><div class="ml-rows">Загрузка…</div><button data-do="invite">Позвать друга</button><button data-do="closeBoard">Назад</button>';}
 try{await pending;const rows=await Hub.leaderboard();if(!social)return;
 for(const k of keys){const list=apps[k].app.querySelector('.ml-rows');list.textContent='';for(const [i,r] of rows.entries()){const el=document.createElement('p');el.textContent=(i+1)+'. '+r.n+' — '+r.s;list.appendChild(el);}}}
 catch(e){for(const k of keys)apps[k].app.querySelector('.ml-rows').textContent='Не удалось загрузить рейтинг';}
}

function plan(values,dir){const next=Array(16).fill(0),paths=[],merges=[];let gain=0;
 for(let line=0;line<4;line++){
  const ids=Array.from({length:4},(_,pos)=>dir==='left'?line*4+pos:dir==='right'?line*4+3-pos:dir==='up'?pos*4+line:(3-pos)*4+line),tiles=ids.filter(i=>values[i]).map(i=>({from:i,value:values[i]}));let out=0;
  for(let j=0;j<tiles.length;j++){const a=tiles[j],target=ids[out++];if(j+1<tiles.length&&a.value===tiles[j+1].value){const b=tiles[++j],v=a.value*2;next[target]=v;gain+=v;merges.push(target);paths.push({...a,to:target,merge:true},{...b,to:target,merge:true});}else{next[target]=a.value;paths.push({...a,to:target,merge:false});}}
 }
 return {board:next,paths,merges,gain,changed:next.some((v,i)=>v!==values[i])};
}
function possible(values=board){return values.includes(0)||['left','right','up','down'].some(d=>plan(values,d).changed);}
function spawn(){const free=board.map((v,i)=>v===0?i:-1).filter(i=>i>=0);if(!free.length)return -1;const i=free[Math.floor(Math.random()*free.length)];board[i]=Math.random()<.9?2:4;return i;}
function newGame(){if(!ready)return;completeRound();closeSocial();submitted=false;elapsed=0;animation=null;queue=null;board=Array(16).fill(0);score=0;demo=false;won=false;over=false;continued=false;spawn();spawned=spawn();spawnTime=performance.now();notice='';sync();remember();}
function demoMerge(){animation=null;queue=null;board=showcase.slice();demo=true;score=0;won=false;over=false;continued=false;move('left');}
function move(dir){if(!ready||social)return false;activeKey=current();if(animation){queue=dir;return false;}if(over||won&&!continued)return false;const result=plan(board,dir);if(!result.changed){if(!possible()){over=true;completeRound();remember();}sync();return false;}
 const old=board.slice();board=result.board;if(!demo){score+=result.gain;best=Math.max(best,score);}animation={start:performance.now(),duration:reduced?80:themes[activeKey].duration,old,paths:result.paths,merges:result.merges,dir};spawned=-1;if(result.merges.length||activeKey==='terminal')playSound(activeKey,result.gain);sync();return true;}
function finish(){if(!animation)return;animation=null;if(!demo){spawned=spawn();spawnTime=performance.now();over=!possible();if(board.some(v=>v>=2048)&&!continued)won=true;if(over)completeRound();}sync();remember();if(queue){const dir=queue;queue=null;move(dir);}}
function sync(){
 const status=notice&&performance.now()<noticeUntil?notice:demo?'Витрина материалов · «Новая игра» — обычная партия':over?'Ходов больше нет. Начнём заново?':won&&!continued?'2048 собрано. Можно продолжить.':'Свайпни по полю: вверх, вниз, влево или вправо';
 for(const k of keys){const {app,cv}=apps[k];app.querySelector('.ml-score').textContent=demo?'ВИТРИНА':score;app.querySelector('.ml-best').textContent=best;app.querySelector('.ml-status').textContent=status;app.querySelector('[data-setting=numbers]').checked=numbers;app.querySelector('[data-setting=sound]').checked=sound;app.querySelector('[data-setting=theme]').value=activeKey;const banner=app.querySelector('.ml-banner');banner.hidden=!(over||won&&!continued);if(!banner.hidden)banner.innerHTML='<strong>'+(over?'Нет свободных ходов':'2048 / готово')+'</strong><button data-do="'+(over?'new':'continue')+'">'+(over?'Ещё одна партия':'Продолжить')+'</button>';cv.setAttribute('aria-label',themes[k].name+'. Поле 2048: '+board.map(v=>v||'пусто').join(', '));}
}
function playSound(k,gain){if(!sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();const t=audio.currentTime,base=170+Math.log2(Math.max(4,gain))*28;
 if(['terminal','paper','crystal'].includes(k)){const b=audio.createBuffer(1,audio.sampleRate*.08,audio.sampleRate),data=b.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,3);const source=audio.createBufferSource(),filter=audio.createBiquadFilter(),vol=audio.createGain();source.buffer=b;filter.type='highpass';filter.frequency.value=k==='crystal'?1800:k==='paper'?450:2600;vol.gain.value=.055;source.connect(filter).connect(vol).connect(audio.destination);source.start(t);}
