<!doctype html>
<html lang="ru">
<head>

<title>FISH POP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" media="print" onload="this.media='all'">

<style>

  --ink:#1a4a6a; --paper:#f4fcff; --accent:#4ab8d8; --frame:#bfe8e0;

#wrap{position:relative; max-width:100%}
body.framed #wrap{box-shadow:0 0 0 calc(var(--u)*2) #2a2434}
canvas{image-rendering:pixelated}
#c{display:block; width:100%; height:100%; touch-action:none; user-select:none; -webkit-user-select:none}
#ui{position:absolute; inset:0; pointer-events:none}
button,a.go{font-family:var(--pixel); cursor:pointer; border:calc(var(--u)*1.5) solid var(--ink); color:var(--ink); background:var(--paper); text-decoration:none}
button:active,a.go:active{transform:translate(var(--u),var(--u))}
button:focus-visible,a.go:focus-visible{outline:calc(var(--u)*1.5) dashed var(--ink); outline-offset:calc(var(--u)*1.5)}
.panel{position:absolute; left:calc(var(--u)*10); right:calc(var(--u)*10); top:calc(var(--u)*16); pointer-events:auto; background:var(--paper); color:var(--ink);
  border:calc(var(--u)*2) solid var(--ink); box-shadow:calc(var(--u)*3) calc(var(--u)*3) 0 var(--accent);
  padding:calc(var(--u)*7) calc(var(--u)*6); display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*5); text-align:center}
h1,h2{margin:0; font-weight:400; line-height:1.15; letter-spacing:.04em}

<body>
<div id="wrap">
  <canvas id="c" width="216" height="384" aria-label="Аквариум с рыбками. Веди пальцем по экрану и отпусти, чтобы опустить рыбку"></canvas>
  <div id="ui">
    <div class="panel" id="menu">
      <h1>FISH<br>POP</h1>

      <div class="score" id="mBest">РЕКОРД 0</div>
      <button class="go alt" id="contBtn" type="button" hidden>ПРОДОЛЖИТЬ</button>
      <button class="go" id="startBtn" type="button">ИГРАТЬ</button>
      <div class="sub">Вырасти кита — он выпустит<br>фонтан и освободит место!</div>
    </div>
    <div class="panel" id="over" hidden>
      <h2 id="overTitle">ИГРА ОКОНЧЕНА</h2>
      <div class="score" id="res"></div>
      <div class="btns">
        <button class="go" id="againBtn" type="button">ЕЩЁ РАЗ</button>
        <button class="go alt" id="menuBtn" type="button">МЕНЮ</button>
      </div>
    </div>
    <div id="friends" aria-label="Друзья в игре"></div>
    <button class="corner" id="boardBtn" type="button">РЕЙТИНГ</button>
    <button class="corner" id="inviteBtn" type="button">ПОЗВАТЬ</button>
    <div class="sheet" id="board" hidden>
      <div class="sheet-h"><h2>РЕЙТИНГ</h2><button class="x" id="boardClose" type="button" aria-label="Закрыть рейтинг">X</button></div>
      <div class="board" id="rows"></div>
      <div class="board-f">
        <button class="go" id="invite" type="button">ПОЗВАТЬ ДРУЗЕЙ</button>
        <div class="note">Друзья именно в FISH POP.<br>Рекорд — лучший аквариум</div>
      </div>
    </div>
    <div id="toast" hidden></div>
  </div>
</div>

<script>
/* =====================================================================

   Сачок опускает рыбку; две одинаковые при касании сливаются в
   следующую по цепочке из 10. Десятая — кит — пускает фонтан и

  { name:'ГУППИ',       r: 9,  c:['#ffb060','#f08a3a','#fff0d8','#a8501a','#b47aff'], pts: 4 },
  { name:'КЛОУН',       r: 12, c:['#ff8a3a','#e06a1a','#ffd0a0','#7a3010','#ff7a2a'], pts: 8 },
  { name:'НЕОНКА',      r: 15, c:['#5a8ae8','#3a64c8','#c8dcff','#1a3478','#8ab8ff'], pts: 14 },
  { name:'РЫБА-ШАР',    r: 18, c:['#ffe070','#f0c040','#fffce0','#a87a1a','#ffd040'], pts: 22 },
  { name:'КОИ',         r: 22, c:['#fff8f0','#e8dcd0','#ffffff','#8a6a5a','#ffe8d8'], pts: 32 },
  { name:'ЗОЛОТАЯ',     r: 26, c:['#ffc83a','#f0a020','#fff4c0','#a8641a','#ffe08a'], pts: 44 },
  { name:'РЫБА-ЛУНА',   r: 30, c:['#a8c0d8','#88a0c0','#e8f0ff','#4a6080','#b8cce0'], pts: 58 },
  { name:'АКУЛЁНОК',    r: 34, c:['#8ab0d0','#6a90b8','#d8ecff','#2a4a6a','#7aa0c4'], pts: 74 },
  { name:'КИТ',         r: 38, c:['#5a9ae8','#3a78d0','#c8e0ff','#1a3a7a','#4a88d8'], pts: 92 },

const MAX = FRUITS.length - 1, BOOM_BONUS = 300;
function blob(g, cx, cy, rx, ry, col, grow){
  rx += grow || 0; ry += grow || 0; g.fillStyle = col;

function finShape(g, pts, col, line, rays){
  const cxp = pts.reduce((a, p) => a + p[0], 0) / pts.length, cyp = pts.reduce((a, p) => a + p[1], 0) / pts.length;

}
// хвост отдельным спрайтом: точка крепления (ax, ay) — у тела, чтобы хвост вилял
function tailSprite(i){

  if (r >= 13 && i !== 8 && i !== 9 && i !== 4){ g.fillStyle = 'rgba(0,0,0,.12)'; const st = Math.max(4, Math.round(r / 4));
    for (let y = cy - ry + st; y < cy + ry * .5; y += st) for (let x = cx - rx * .7 + ((y / st) % 2) * st / 2; x < cx + rx * .25; x += st){ if (inBody(x, y) && inBody(x + st, y)){ g.fillRect(Math.round(x), Math.round(y), 1, 1); g.fillRect(Math.round(x + 1), Math.round(y + 1), st - 2, 1); g.fillRect(Math.round(x + st - 1), Math.round(y), 1, 1); } } }
  // жабры
  g.strokeStyle = 'rgba(0,0,0,.22)'; g.lineWidth = 1; g.beginPath(); g.arc(cx + rx * .05, cy, ry * .5, -1.1, 1.1); g.stroke();
  if (i === 8) for (let k = 0; k < 3; k++) R(g, cx - rx * .1 + k * 3, cy - ry * .2, 1, Math.round(ry * .32), dark);

  g.globalAlpha = .4; blob(g, cx - rx * .15, cy - ry * .45, Math.max(1, Math.round(rx * .55)), Math.max(1, Math.round(ry * .25)), hi); g.globalAlpha = 1;

const SPR = FRUITS.map((_, i) => fishSprite(i));
function slimeFace(g, f, x, y, sx, sy, t, lookX, lookY, sc, dir){
  sc = sc || 1; dir = dir || 1; const S = FRUITS[f.t], r = S.r * sc, [rx0, ry0] = BODY(f.t), rx = rx0 * sc, ry = ry0 * sc; sx /= sc; sy /= sc;

  }

    for (let i = 0; i < fruits.length; i++){ const a = fruits[i]; if (a.gone) continue;
      for (let j = i + 1; j < fruits.length; j++){ const b = fruits[j]; if (b.gone) continue;

function update(dt){

  for (const r of rings) r.t -= dt; rings = rings.filter(r => r.t > 0);
  for (const f of floats){ f.t -= dt; f.y -= 18 * dt; } floats = floats.filter(f => f.t > 0);
  shake = Math.max(0, shake - dt);
  if (state !== 'play') return;
  playT += dt; dropCd = Math.max(0, dropCd - dt);
  const kx = (keys.ArrowRight || keys.d || keys['в'] ? 1 : 0) - (keys.ArrowLeft || keys.a || keys['ф'] ? 1 : 0); if (kx) aimX = clamp(aimX + kx * 140 * dt, BOX.l, BOX.r);
  for (let s = 0; s < SUB; s++) step(dt / SUB);
  for (const f of fruits){ if (Math.abs(f.vx) > 25) f.dir = Math.sign(f.vx); f.sqv = (f.sqv || 0) + (-220 * (f.sq || 0) - 9 * f.sqv) * dt; f.sq = clamp((f.sq || 0) + f.sqv * dt, -0.28, 0.28); if (f.pop > 0) f.pop -= dt; if (f.boom > 0){ f.boom -= dt; if (f.boom <= 0) explode(f); } }

  // переполнение: рыбка, которая давно в аквариуме, торчит над линией и почти не движется
  const over = fruits.some(f => f.age > 1.2 && f.y - f.r < LINE_Y && Math.abs(f.vy) < 40);
  danger = over ? danger + dt : Math.max(0, danger - dt * 2);

}

  if (Math.sin(t * 0.9) > 0.92 && Math.random() < 0.5) bubbles.push({ x: 130 + rand(-4, 4), y: BOX.bottom - 26, r: ri(1, 3), v: rand(20, 34) });
  // водоросли качаются
  for (const [x0, h, col] of [[22, 60, '#3ab86a'], [30, 42, '#5ad88a'], [124, 50, '#3ab86a'], [134, 34, '#7ae8a0'], [166, 46, '#2aa05a']]){ for (let k = 0; k < h; k += 2){ const sw = Math.sin(t * 1.6 + k / 9 + x0) * (k / h) * 5; R(ctx, x0 + sw, BOX.bottom - 10 - k, 3, 2, col); if (k % 8 === 0) R(ctx, x0 + sw + 3, BOX.bottom - 10 - k, 3, 2, col); } }
  // поверхность воды
  for (let x = BOX.l; x < BOX.r; x += 2){ const y = BOX.top + Math.round(Math.sin(t * 2 + x / 10) * 1.2); R(ctx, x, y, 2, 1, 'rgba(255,255,255,.7)'); }
  // пузырьки в жидкости
  if (Math.random() < 0.3) bubbles.push({ x: Math.random() < .6 ? rand(56, 66) : rand(BOX.l + 6, BOX.r - 6), y: BOX.bottom - 10, r: ri(1, 3), v: rand(18, 36) });
  R(ctx, 55, BOX.bottom - 12, 12, 4, '#8a8aa0'); R(ctx, 55, BOX.bottom - 12, 12, 1, '#b8b8c8');
  for (const b of bubbles){ b.y -= b.v * 0.016; b.x += Math.sin(b.y / 9) * 0.15; } bubbles = bubbles.filter(b => b.y > BOX.top + 4);
  ctx.globalAlpha = .7; for (const b of bubbles){ disc(ctx, b.x, b.y, b.r, '#ffffff'); if (b.r > 1) disc(ctx, b.x, b.y, b.r - 1, '#bfeaff'); } ctx.globalAlpha = 1;
  // линия переполнения
  const dz = danger > 0.2, blink = dz && Math.sin(t * (8 + danger * 6)) > 0;
  for (let x = BOX.l + 2; x < BOX.r - 2; x += 8) R(ctx, x, LINE_Y, 4, 1, blink ? '#ff3a6a' : 'rgba(255,255,255,.75)');
  const lookX = clamp(aimX, BOX.l, BOX.r), lookY = DROP_Y;
  // сачок с рыбкой
  if (state === 'play'){
    const r = FRUITS[held].r, x = clamp(aimX, BOX.l + r, BOX.r - r);
    let yb = BOX.bottom; for (const f of fruits) if (Math.abs(f.x - x) < f.r + r * .3 && f.y - f.r < yb && f.y > DROP_Y) yb = f.y - f.r;
    for (let y = DROP_Y + r + 4; y < yb - 2; y += 9) R(ctx, x, y, 1, 5, 'rgba(255,255,255,.9)');
    R(ctx, x - 1, 34, 3, 10, '#8a5a2a'); R(ctx, x, 34, 1, 10, '#c8945a'); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(x + .5, DROP_Y + 1, r + 4, r * .55 + 3, 0, 0, Math.PI); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x - r - 3.5, DROP_Y + 1); ctx.lineTo(x + r + 4.5, DROP_Y + 1); ctx.stroke(); R(ctx, x - r - 4, 43, r * 2 + 9, 1, '#8a5a2a');
    const sc = dropCd > 0 ? 1 - dropCd * .9 : 1; drawSlime(ctx, { t: held, x, y: DROP_Y, id: 0, sq: Math.sin(t * 4) * .04, pop: 0, boom: 0 }, t, x, BOX.bottom, sc);
  }
  ctx.save(); ctx.beginPath(); ctx.rect(BOX.l, 0, BOX.r - BOX.l, BOX.bottom); ctx.clip();
  for (const f of fruits){ let sc = 1; if (f.pop > 0) sc = 1 + Math.sin((0.2 - f.pop) / 0.2 * Math.PI) * 0.16; if (f.boom > 0) sc = 1 + (1.1 - f.boom) * 0.14 + Math.sin(t * 40) * 0.03;
    drawSlime(ctx, f, t, lookX, lookY, sc);
    if (f.boom > 0 && Math.sin(t * 24) > 0){ ctx.globalAlpha = .3; disc(ctx, f.x, f.y, f.r * sc, '#ffffff'); ctx.globalAlpha = 1; } }
  ctx.restore();
  // передние водоросли — поверх рыб, для глубины
  for (const [x0, h, col] of [[BOX.l + 2, 34, '#2a9a5a'], [BOX.r - 8, 40, '#3ab86a'], [BOX.r - 2, 24, '#2a9a5a']]){ for (let k = 0; k < h; k += 2){ const sw = Math.sin(t * 1.4 + k / 8 + x0) * (k / h) * 4; R(ctx, x0 + sw, BOX.bottom - 4 - k, 4, 2, col); if (k % 6 === 0) R(ctx, x0 + sw + (k % 12 ? 4 : -3), BOX.bottom - 4 - k, 3, 2, col); } }
  ctx.drawImage(FRONT, 0, 0);
  for (const r of rings){ const k = 1 - r.t / (r.big ? 0.5 : 0.3), rad = r.r + k * (r.big ? 70 : 14); ctx.globalAlpha = r.t * 2.5; ctx.strokeStyle = r.col; ctx.lineWidth = r.big ? 3 : 1; ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1; }
  for (const p of parts){ ctx.globalAlpha = clamp(p.life * 2, 0, 1); if (p.s >= 3){ disc(ctx, p.x, p.y, Math.round(p.s / 2), p.col); R(ctx, p.x - 1, p.y - 1, 1, 1, 'rgba(255,255,255,.8)'); } else R(ctx, p.x, p.y, p.s, p.s, p.col); } ctx.globalAlpha = 1;
  for (const f of floats){ ctx.globalAlpha = Math.min(1, f.t * 2); txt(ctx, f.s, f.x, f.y, f.col, 6, 'center', '#1a4a6a'); } ctx.globalAlpha = 1;
  ctx.restore();
  // HUD
  panel(ctx, 6, 6, 52, 24); txt(ctx, 'NEXT', 10, 15, '#2a6a7a', 5); drawSlime(ctx, { t: next, x: 46, y: 18 - 0, id: 9, sq: 0, pop: 0, boom: 0 }, t, 46, 40, Math.min(1, 9 / FRUITS[next].r));
  panel(ctx, 76, 13, 64, 22); R(ctx, 90, 3, 36, 10, '#4a98aa'); R(ctx, 91, 4, 34, 8, '#6ab8c8');
  R(ctx, 94, 5, 5, 4, '#ffd84a'); R(ctx, 95, 9, 3, 2, '#c89a2a'); txt(ctx, String(Math.max(best, score)), 113, 5, '#ffffff', 5, 'center');
  txt(ctx, String(score), 108, 20, '#2a7a9a', 8, 'center');
  panel(ctx, 158, 6, 52, 24); txt(ctx, 'КИТЫ', 184, 10, '#2a6a7a', 4, 'center'); txt(ctx, String(booms), 184, 18, '#3a78d0', 7, 'center');
  // цепочка эволюции
  const cy = 362; panel(ctx, 4, cy - 13, W - 8, 25);
  for (let i = 0; i < FRUITS.length; i++){ const x = 14 + i * 20.8; drawSlime(ctx, { t: i, x, y: cy, id: i, sq: 0, pop: 0, boom: 0 }, t, x, cy - 30, Math.min(1, 8 / FRUITS[i].r)); if (i > maxType && state === 'play'){ ctx.globalAlpha = .65; disc(ctx, x, cy, 9, '#f4fcff'); ctx.globalAlpha = 1; } }
  if (danger > 0.2 && state === 'play'){ ctx.globalAlpha = Math.min(1, danger) * (0.6 + 0.4 * Math.sin(t * 12)); txt(ctx, 'АКВАРИУМ ПЕРЕПОЛНЕН!', 108, 66, '#ff3a6a', 6, 'center', '#ffffff'); ctx.globalAlpha = 1; }
}

// ================= МАСШТАБ, МЕНЮ, РЕЙТИНГ =================
function fit(){
  const big = innerWidth >= 700 && innerHeight >= 700; document.body.classList.toggle('framed', big);
  const aw = innerWidth - (big ? 32 : 0), ah = innerHeight - (big ? 24 : 0);
  let s = Math.min(aw / W, ah / H); if (big && s >= 2) s = Math.floor(s);
  wrap.style.width = W*s + 'px'; wrap.style.height = H*s + 'px'; document.documentElement.style.setProperty('--u', (s * 0.85) + 'px');
  document.body.style.background = big ? '' : '#bfe8e0';
}
addEventListener('resize', fit); fit();
let FRIENDS = [], BOARD = [];
const esc = s => String(s).replace(/[<>&"]/g, '');
function avatar(f){ return f.photo ? `<span class="av"><img src="${esc(f.photo)}" alt=""></span>` : `<span class="av" style="background:${esc(f.c || '#c8784a')}">${esc((f.n || '?')[0])}</span>`; }
function renderFriends(){
  $('friends').innerHTML = FRIENDS.slice(0, 4).map(f => `<button class="fr" type="button" title="${esc(f.n)}">${avatar(f)}<span class="fs">${f.s}</span></button>`).join('')
    + `<button class="fr" type="button" id="addFriend" aria-label="Пригласить друга"><span class="av add">+</span><span class="fs">ЗВАТЬ</span></button>`;
  $('friends').querySelectorAll('.fr').forEach(b => b.onclick = b.id === 'addFriend' ? invite : openBoard);
}
function renderBoard(){
  $('rows').innerHTML = BOARD.map((r, i) => `<div class="lr${r.me ? ' me' : ''}"><span>${i + 1}</span>${avatar(r)}<span class="nm">${esc(r.n)}</span><span>${r.s}</span></div>`).join('')
    + (BOARD.filter(r => !r.me).length ? '' : `<div class="note" style="padding:calc(var(--u)*3) 0">Друзей пока нет.<br>Нажми «Позвать друзей»</div>`);
}
async function loadSocial(){ FRIENDS = await Hub.friends(); BOARD = await Hub.leaderboard(); renderFriends(); renderBoard(); }
function openBoard(){ $('board').hidden = false; renderBoard(); }
function closeSheets(){ $('board').hidden = true; }
function invite(){ Hub.invite(); }
$('boardBtn').onclick = openBoard; $('boardClose').onclick = closeSheets; $('inviteBtn').onclick = invite; $('invite').onclick = invite;
function setHome(show){ $('boardBtn').hidden = !show; $('inviteBtn').hidden = !show; $('friends').hidden = !show; }
function refreshMenu(){ $('mBest').textContent = `РЕКОРД ${best}`; }

let last = 0;
function frame(ms){ const t = ms / 1000, dt = last ? Math.min((ms - last) / 1000, 0.04) : 1/60; last = ms; update(dt); draw(t); requestAnimationFrame(frame); }
function begin(){ closeSheets(); state = 'play'; $('menu').hidden = true; $('over').hidden = true; setHome(false); last = 0; pointerDown = false; }
function startNew(){ SAVED = null; showCont(); newGame(); begin(); }
function finish(){
  if (state !== 'play') return; state = 'over'; SAVED = null; Hub.clearRun();
  const rec = score > best; if (rec) best = score;
  Hub.submitRun({ score, duration: Math.round(playT) }).then(() => loadSocial());
  $('overTitle').textContent = rec && score > 0 ? 'НОВЫЙ РЕКОРД!' : 'АКВАРИУМ ПОЛОН';
  $('res').innerHTML = `СЧЁТ ${score}<br>СЛИЯНИЙ ${merges}<br>КИТОВ ${booms}<br>ЛУЧШИЙ: ${FRUITS[maxType].name}<br>РЕКОРД ${best}`;
  $('over').hidden = false; setHome(true); refreshMenu();
}
function toMenu(){ state = 'menu'; fruits = []; $('over').hidden = true; $('menu').hidden = false; setHome(true); showCont(); }
// ---- продолжение партии после выхода: аквариум сохраняется целиком
let SAVED = null;
Hub.autosave(() => state === 'play' ? { score, merges, booms, maxType, held, next, t: Math.round(playT), f: fruits.filter(f => !f.boom).map(f => [f.t, Math.round(f.x), Math.round(f.y)]) } : null);
function resume(){ const s = SAVED; if (!s) return startNew(); SAVED = null; newGame();
  score = s.score; merges = s.merges; booms = s.booms; held = s.held; next = s.next; playT = s.t || 0;
  for (const [t, x, y] of s.f) addFruit(t, x, y); maxType = Math.max(maxType, s.maxType || 0); fruits.forEach(f => f.age = 2); begin(); }
function showCont(){ $('contBtn').hidden = !SAVED; if (SAVED) $('contBtn').textContent = `ПРОДОЛЖИТЬ · ${SAVED.score}`; }
$('contBtn').onclick = resume; $('startBtn').onclick = startNew; $('againBtn').onclick = startNew; $('menuBtn').onclick = toMenu;
document.addEventListener('visibilitychange', () => { pointerDown = false; for (const k in keys) keys[k] = false; });

// витрина в меню: несколько рыбок на дне аквариума
newGame(); [[2, 40], [4, 80], [6, 130], [3, 180], [1, 196], [5, 30]].forEach(([t, x]) => addFruit(t, x, BOX.bottom - 40));
for (let i = 0; i < 400; i++) step(1 / 120);
refreshMenu(); requestAnimationFrame(frame);
Hub.init(GAME_ID).then(r => { USER = r.user || USER; best = r.best || 0; SAVED = (r.data && r.data.run) || null; showCont(); refreshMenu(); loadSocial(); });
</script>
