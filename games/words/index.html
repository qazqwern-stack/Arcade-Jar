<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Слова из слова</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'">
<script src="../../hub-sdk.js"></script>
<script src="levels.js"></script>
<style>
/* «Слова из слова»: настольная игра на тёплой бумаге — костяные фишки, терракота и зелёное сукно.
   Сверху исходное слово фишками, под ним набираемое слово, ниже — список слов уровня по длине. */
:root{
  --paper:#f5ecdc; --paper-2:#efe2cb; --card:#fffaf0; --ink:#3b2a1e; --muted:#8a7360; --line:#e2d2b6;
  --tile:#fff7e8; --tile-edge:#d9c29c; --tile-shadow:#b89a6c; --used:#e7dac2;
  --terra:#d0603a; --terra-2:#b84e2b; --green:#2f7d5b; --green-2:#256a4c; --gold:#e6a92b;
  --font:'Rubik', 'Segoe UI', system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0; height:100%}
body{background:var(--paper); color:var(--ink); font:15px/1.4 var(--font); -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(120,90,50,.06) 1px, transparent 1px); background-size:14px 14px;
  overflow:hidden; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0}
button:focus-visible{outline:2px solid var(--terra); outline-offset:2px}
[hidden]{display:none!important}

.app{height:100%; max-width:560px; margin:0 auto; display:flex; flex-direction:column;
  padding:max(10px, env(safe-area-inset-top,0px)) max(14px, env(safe-area-inset-right,0px)) max(12px, env(safe-area-inset-bottom,0px)) max(14px, env(safe-area-inset-left,0px))}

/* ---------- верх ---------- */
.top{display:flex; align-items:center; justify-content:space-between; gap:10px}
.lvl{font-weight:800; font-size:18px; letter-spacing:-.01em}
.lvl small{display:block; font-weight:500; font-size:12px; color:var(--muted); letter-spacing:0}
.top-r{display:flex; align-items:center; gap:8px}
.coins{display:inline-flex; align-items:center; gap:6px; font-weight:700; background:var(--card); border:1.5px solid var(--line); border-radius:999px; padding:5px 11px 5px 7px; font-variant-numeric:tabular-nums}
.c{width:16px; height:16px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff1b8, var(--gold) 50%, #b67a10); box-shadow:inset 0 -1px 0 rgba(0,0,0,.2)}
.ibtn{width:36px; height:36px; border-radius:12px; background:var(--card); border:1.5px solid var(--line); display:inline-flex; align-items:center; justify-content:center}
.ibtn svg{width:19px; height:19px}

/* ---------- прогресс ---------- */
.prog{margin-top:12px}
.prog-t{display:flex; justify-content:space-between; font-size:13px; color:var(--muted)}
.prog-t b{color:var(--ink)}
.bar{height:8px; background:var(--paper-2); border-radius:8px; margin-top:6px; overflow:hidden; border:1px solid var(--line)}
.bar span{display:block; height:100%; background:linear-gradient(90deg, var(--green), #46a57a); border-radius:8px; transition:width .35s}

/* ---------- фишки исходного слова ---------- */
.board{margin-top:14px; display:flex; flex-wrap:wrap; justify-content:center; gap:6px}
.tile{--sz:min(44px, calc((100vw - 28px - 11*6px) / var(--n)));
  width:var(--sz); height:calc(var(--sz) * 1.12); border-radius:9px; background:var(--tile); border:1.5px solid var(--tile-edge);
  box-shadow:0 3px 0 var(--tile-shadow); font-weight:800; font-size:calc(var(--sz) * .52); text-transform:uppercase;
  display:flex; align-items:center; justify-content:center; transition:transform .08s, background .15s}
.tile:active{transform:translateY(2px); box-shadow:0 1px 0 var(--tile-shadow)}
.tile.used{background:var(--used); color:#b9a68a; box-shadow:0 1px 0 var(--tile-shadow); transform:translateY(2px)}

/* ---------- набираемое слово ---------- */
.entry{margin-top:14px; display:flex; align-items:center; gap:8px}
.typed{flex:1; min-height:52px; border-radius:14px; background:var(--card); border:1.5px dashed var(--tile-edge); display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:24px; letter-spacing:.08em; text-transform:uppercase; padding:0 10px; overflow:hidden; white-space:nowrap}
.typed:empty::before{content:'нажимайте на буквы'; font-weight:500; font-size:14px; letter-spacing:0; text-transform:none; color:var(--muted)}
.typed.bad{animation:shake .32s; border-color:var(--terra); color:var(--terra)}
.typed.ok{border-style:solid; border-color:var(--green); color:var(--green)}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.del{width:52px; height:52px; border-radius:14px; background:var(--card); border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center}
.del svg{width:22px; height:22px}
.go{height:52px; padding:0 18px; border-radius:14px; background:var(--green); color:#fff; font-weight:700; font-size:16px; box-shadow:0 3px 0 var(--green-2)}
.go:active{transform:translateY(2px); box-shadow:0 1px 0 var(--green-2)}
.go:disabled{opacity:.45}

/* ---------- подсказки ---------- */
.hints{margin-top:10px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.hint{display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600; padding:7px 12px; border-radius:999px; background:var(--card); border:1.5px solid var(--line)}
.hint .c{width:13px; height:13px}
.bonus-chip{font-size:13px; font-weight:600; padding:7px 12px; border-radius:999px; background:#f8e6d6; color:var(--terra-2); border:1.5px solid #efcdb3}

/* ---------- список слов ---------- */
.words{margin-top:12px; flex:1; overflow:auto; -webkit-overflow-scrolling:touch; padding-bottom:8px; overscroll-behavior:contain}
.grp{margin-bottom:12px}
.grp h4{margin:0 0 6px; font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.08em}
.grp .list{display:flex; flex-wrap:wrap; gap:6px}
.w{display:inline-flex; gap:2px; padding:5px 7px; border-radius:9px; background:var(--card); border:1.5px solid var(--line)}
.w i{width:13px; height:17px; border-radius:3px; background:var(--paper-2); font-style:normal; font-size:12px; font-weight:700; line-height:17px; text-align:center; text-transform:uppercase; color:var(--terra-2)}
.w.found{background:#e3f1e8; border-color:#b8dbc6}
.w.found i{background:transparent; color:var(--green-2); width:auto; min-width:9px; font-size:14px}
.w.flash{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.15)}}

/* ---------- окна ---------- */
.sheet-bg{position:fixed; inset:0; background:rgba(59,42,30,.35); z-index:20; display:flex; align-items:flex-end; justify-content:center}
.sheet{width:100%; max-width:560px; max-height:82%; overflow:auto; background:var(--card); border-radius:22px 22px 0 0; padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -12px 40px rgba(0,0,0,.15)}
.sheet h3{margin:0 0 4px; font-size:22px; font-weight:800}
.sheet p{margin:0 0 14px; color:var(--muted)}
.sheet .row{display:flex; gap:8px; flex-wrap:wrap}
.btn{flex:1; min-width:130px; height:48px; border-radius:14px; font-weight:700; background:var(--paper-2); border:1.5px solid var(--line)}
.btn.main{background:var(--terra); color:#fff; border:0; box-shadow:0 3px 0 var(--terra-2)}
.lb{display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
.lr{display:grid; grid-template-columns:24px 32px 1fr auto; gap:10px; align-items:center; padding:8px 10px; border-radius:12px; background:var(--paper)}
.lr.me{background:#e3f1e8}
.lr b{font-variant-numeric:tabular-nums}
.av{width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; overflow:hidden; background:var(--terra)}
.av img{width:100%; height:100%; object-fit:cover}
.bonus-list{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px}
.bonus-list span{padding:4px 9px; border-radius:8px; background:#f8e6d6; color:var(--terra-2); font-weight:600}
.credits{font-size:11px; color:var(--muted); margin-top:10px}

#toast{position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top,0px)); transform:translateX(-50%); z-index:30; background:var(--ink); color:var(--paper);
  font-size:14px; font-weight:600; padding:10px 16px; border-radius:12px; max-width:86%; width:max-content; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.2)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="lvl" id="lvlTitle">Уровень 1<small>Слова из слова</small></div>
    <div class="top-r">
      <span class="coins" aria-label="Монеты"><span class="c"></span><span id="coins">0</span></span>
      <button class="ibtn" id="boardBtn" type="button" aria-label="Рейтинг друзей"><svg viewBox="0 0 20 20" fill="currentColor"><rect x="2" y="10" width="4" height="8" rx="1"/><rect x="8" y="4" width="4" height="14" rx="1"/><rect x="14" y="7" width="4" height="11" rx="1"/></svg></button>
      <button class="ibtn" id="inviteBtn" type="button" aria-label="Позвать друга"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="7" r="3.2"/><path d="M2.5 17c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5M16 6v6M13 9h6"/></svg></button>
    </div>
  </div>

  <div class="prog">
    <div class="prog-t"><span>Найдено <b id="foundN">0</b> из <b id="totalN">0</b></span><span id="goalTxt"></span></div>
    <div class="bar"><span id="barFill" style="width:0%"></span></div>
  </div>

  <div class="board" id="board" role="group" aria-label="Буквы исходного слова"></div>

  <div class="entry">
    <div class="typed" id="typed" aria-live="polite"></div>
    <button class="del" id="delBtn" type="button" aria-label="Стереть букву"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h11v14H8l-6-7z"/><path d="M11 8l5 6M16 8l-5 6"/></svg></button>
    <button class="go" id="goBtn" type="button" disabled>Ввод</button>
  </div>

  <div class="hints">
    <button class="hint" id="hintLetter" type="button">Открыть букву · <span class="c"></span>5</button>
    <button class="hint" id="hintWord" type="button">Открыть слово · <span class="c"></span>15</button>
    <button class="bonus-chip" id="bonusBtn" type="button">Бонусные: 0</button>
  </div>

  <div class="words" id="words"></div>
</div>

<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[<>&"]/g, '');
const LEVELS = window.WORD_LEVELS || [];
const GAME_ID = 'words';
const REWARD = { word:1, bonus:1, level:5, perfect:5 };          // ~5 монет в минуту при обычном темпе
const HINT = { letter:{ id:'hint_letter', price:5 }, word:{ id:'hint_word', price:15 } };
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; };

// ---------- состояние ----------
let USER = { name:'Вы' }, coins = 0, lv = 0, L, found = new Set(), bonus = new Set(), rev = {}, passed = false;
let picked = [];   // индексы фишек в порядке нажатия

function goalOf(level){ return Math.min(12, Math.ceil(level.m.length * 0.5)); }
function loadLevel(i, saved){
  lv = Math.max(0, Math.min(i, LEVELS.length - 1)); L = LEVELS[lv];
  const keep = saved && saved.lv === lv;
  found = new Set(keep ? (saved.found || []).filter(w => L.m.includes(w)) : []);
  bonus = new Set(keep ? (saved.bonus || []).filter(w => L.b.includes(w)) : []);
  rev = keep && saved.rev ? saved.rev : {};
  passed = found.size >= goalOf(L);
  picked = []; renderAll();
}
function save(){ Hub.save({ lv, found:[...found], bonus:[...bonus], rev }); }

// ---------- отрисовка ----------
function renderAll(){ renderTop(); renderBoard(); renderTyped(); renderWords(); }
function renderTop(){
  $('lvlTitle').innerHTML = `Уровень ${lv + 1}<small>${LEVELS.length ? `из ${LEVELS.length}` : ''}</small>`;
  $('coins').textContent = coins;
  const goal = goalOf(L);
  $('foundN').textContent = found.size; $('totalN').textContent = L.m.length;
  $('goalTxt').textContent = passed ? (found.size === L.m.length ? 'Все слова найдены!' : 'Уровень пройден ✓') : `для прохода: ${goal}`;
  $('barFill').style.width = Math.round(found.size / L.m.length * 100) + '%';
  $('bonusBtn').textContent = `Бонусные: ${bonus.size}`;
}
function renderBoard(){
  const b = $('board'); b.innerHTML = '';
  [...L.w].forEach((ch, i) => {
    const t = document.createElement('button'); t.type = 'button'; t.className = 'tile' + (picked.includes(i) ? ' used' : '');
    t.style.setProperty('--n', Math.max(7, L.w.length)); t.textContent = ch; t.setAttribute('aria-label', 'Буква ' + ch);
    t.onclick = () => pick(i); b.appendChild(t);
  });
}
function renderTyped(){ $('typed').className = 'typed'; $('typed').textContent = picked.map(i => L.w[i]).join(''); $('goBtn').disabled = picked.length < 3; }
function renderWords(flashWord){
  const box = $('words'); box.innerHTML = '';
  const groups = {}; for (const w of L.m) (groups[w.length] = groups[w.length] || []).push(w);
  for (const len of Object.keys(groups).sort((a, b) => a - b)){
    const g = document.createElement('div'); g.className = 'grp';
    g.innerHTML = `<h4>${len} ${plural(+len, 'буква', 'буквы', 'букв')}</h4><div class="list"></div>`;
    const list = g.querySelector('.list');
    for (const w of groups[len]){
      const el = document.createElement('span'), f = found.has(w), open = rev[w] || 0;
      el.className = 'w' + (f ? ' found' : '') + (w === flashWord ? ' flash' : '');
      el.innerHTML = f ? [...w].map(ch => `<i>${ch}</i>`).join('') : [...w].map((ch, k) => `<i>${k < open ? ch : ''}</i>`).join('');
      el.setAttribute('aria-label', f ? w : `скрытое слово, ${len} ${plural(+len, 'буква', 'буквы', 'букв')}`);
      list.appendChild(el);
    }
    box.appendChild(g);
  }
  if (flashWord){ const el = box.querySelector('.flash'); el && el.scrollIntoView({ block:'nearest', behavior:'smooth' }); }
}

// ---------- ввод ----------
function pick(i){ if (picked.includes(i)) return; picked.push(i); renderBoard(); renderTyped(); }
function back(){ picked.pop(); renderBoard(); renderTyped(); }
function clearTyped(){ picked = []; renderBoard(); renderTyped(); }
function typeLetter(ch){ ch = ch.toLowerCase().replace('ё', 'е');
  const i = [...L.w].findIndex((c, k) => c === ch && !picked.includes(k)); if (i >= 0) pick(i); }

function submit(){
  const word = picked.map(i => L.w[i]).join(''); if (word.length < 3) return;
  const t = $('typed');
  if (found.has(word) || bonus.has(word)){ toast('Это слово уже найдено'); return fail(); }
  if (L.m.includes(word)){
    found.add(word); delete rev[word]; Hub.earn(REWARD.word); coins += REWARD.word;
    t.className = 'typed ok'; setTimeout(clearTyped, 380); afterFind(word); return;
  }
  if (L.b.includes(word)){
    bonus.add(word); Hub.earn(REWARD.bonus); coins += REWARD.bonus; save();
    t.className = 'typed ok'; toast(`Бонусное слово «${word}» +${REWARD.bonus}`); setTimeout(clearTyped, 380); renderTop(); return;
  }
  toast('Такого слова нет в словаре'); fail();
}
function fail(){ const t = $('typed'); t.className = 'typed'; void t.offsetWidth; t.className = 'typed bad'; setTimeout(clearTyped, 420); }

function afterFind(word){
  save(); renderWords(word); renderTop();
  if (!passed && found.size >= goalOf(L)){
    passed = true; Hub.earn(REWARD.level); coins += REWARD.level; renderTop();
    Hub.submitRun({ score: lv + 1, duration: 0 });
    setTimeout(() => showSheet(`<h3>Уровень пройден!</h3><p>+${REWARD.level} монет. Можно идти дальше или найти оставшиеся слова — за все слова ещё +${REWARD.perfect}.</p>
      <div class="row"><button class="btn" data-a="stay" type="button">Остаться</button><button class="btn main" data-a="next" type="button">Следующий уровень</button></div>`), 450);
  } else if (found.size === L.m.length){
    Hub.earn(REWARD.perfect); coins += REWARD.perfect; renderTop();
    setTimeout(() => showSheet(`<h3>Все слова найдены!</h3><p>Отличный словарный запас. +${REWARD.perfect} монет.</p>
      <div class="row"><button class="btn main" data-a="next" type="button">Следующий уровень</button></div>`), 450);
  }
}
function nextLevel(){
  if (lv >= LEVELS.length - 1){ toast('Это последний уровень. Скоро добавим новые!'); return; }
  loadLevel(lv + 1); save();
}

// ---------- подсказки ----------
function hidden(){ return L.m.filter(w => !found.has(w)); }
async function useHint(kind){
  const left = hidden(); if (!left.length) return toast('Все слова уже открыты');
  const h = HINT[kind];
  if (coins < h.price) return toast(`Нужно ${h.price} монет — ищите слова, за каждое +1`);
  const r = await Hub.buy({ id:h.id, cur:'coin', price:h.price, title:kind, consumable:true });
  if (!r || !r.ok) return toast((r && r.message) || 'Не получилось');
  coins = r.coins;
  let w;
  if (kind === 'letter'){
    // слово, которое уже начали открывать, иначе самое короткое
    w = left.slice().sort((a, b) => (rev[b] || 0) - (rev[a] || 0) || a.length - b.length)[0];
    rev[w] = (rev[w] || 0) + 1;
    if (rev[w] >= w.length){ found.add(w); delete rev[w]; return afterFind(w); }
    save(); renderWords(); renderTop(); toast('Открыта буква');
  } else {
    w = left.slice().sort((a, b) => a.length - b.length)[0];
    found.add(w); delete rev[w]; afterFind(w);
  }
}

// ---------- окна ----------
function showSheet(html){ $('sheet').innerHTML = html; $('sheetBg').hidden = false;
  $('sheet').querySelectorAll('[data-a]').forEach(b => b.onclick = () => { const a = b.dataset.a; closeSheet();
    if (a === 'next') nextLevel(); if (a === 'invite') Hub.invite(); }); }
function closeSheet(){ $('sheetBg').hidden = true; }
$('sheetBg').onclick = e => { if (e.target === $('sheetBg')) closeSheet(); };

function avatar(f){ return f.photo ? `<span class="av"><img src="${esc(f.photo)}" alt=""></span>` : `<span class="av" style="background:${esc(f.c || '#d0603a')}">${esc((f.n || '?')[0])}</span>`; }
async function openBoard(){
  const rows = await Hub.leaderboard();
  const list = rows.map((r, i) => `<div class="lr${r.me ? ' me' : ''}"><span>${i + 1}</span>${avatar(r)}<span>${esc(r.n)}</span><b>${r.s} ${plural(r.s, 'уровень', 'уровня', 'уровней')}</b></div>`).join('');
  const none = rows.filter(r => !r.me).length ? '' : '<p>Друзей пока нет. Позовите друга — и соревнуйтесь, кто пройдёт больше уровней.</p>';
  showSheet(`<h3>Рейтинг друзей</h3><p>Друзья именно в «Словах из слова».</p><div class="lb">${list}</div>${none}
    <div class="row"><button class="btn main" data-a="invite" type="button">Позвать друга</button><button class="btn" data-a="close" type="button">Закрыть</button></div>`);
}
$('bonusBtn').onclick = () => showSheet(`<h3>Бонусные слова</h3><p>Редкие слова, которых нет в списке уровня. За каждое +${REWARD.bonus} монета.</p>
  <div class="bonus-list">${[...bonus].map(w => `<span>${esc(w)}</span>`).join('') || '<p>Пока ни одного — попробуйте редкие слова!</p>'}</div>
  <div class="row"><button class="btn" data-a="close" type="button">Закрыть</button></div>
  <div class="credits">Словарь: Russian-Nouns (MIT), частотность: FrequencyWords (CC BY-SA 4.0).</div>`);

let toastT; function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1800); }

// ---------- управление ----------
$('delBtn').onclick = back;
$('goBtn').onclick = submit;
$('typed').onclick = clearTyped;
$('hintLetter').onclick = () => useHint('letter');
$('hintWord').onclick = () => useHint('word');
$('boardBtn').onclick = openBoard;
$('inviteBtn').onclick = () => Hub.invite();
addEventListener('keydown', e => {
  if (!$('sheetBg').hidden){ if (e.key === 'Escape') closeSheet(); return; }
  if (e.key === 'Enter') submit(); else if (e.key === 'Backspace') back(); else if (e.key === 'Escape') clearTyped();
  else if (/^[а-яё]$/i.test(e.key)) typeLetter(e.key);
});

// ---------- старт ----------
Hub.init(GAME_ID).then(r => {
  USER = r.user || USER; coins = r.coins || 0;
  const d = r.data || {};
  loadLevel(Number.isInteger(d.lv) ? d.lv : 0, d);
});
</script>
</body>
</html>
