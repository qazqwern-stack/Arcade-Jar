<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SKYHOOP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" media="print" onload="this.media='all'">
<script src="../../hub-sdk.js"></script>
<style>
/* Layout: one 9:16 pixel screen (180×320 scaled by whole pixels). Menu panel docked top,
   friends strip above the corners, RATING bottom-left, SHOP bottom-right.
   Menu recolors from the equipped background; shop and rating sheets keep one neutral palette. */
:root{
  --ink:#5a2a6b; --paper:#fff0f7; --accent:#e0609a; --frame:#2b1530;
  --s-ink:#1d1a2b; --s-paper:#e9e7f2; --s-card:#f7f6fb; --s-accent:#6b5fd6; --s-muted:#6e6a82;
  --coin:#ffd84a; --coin-edge:#6b4a10;
  --u:2px;
  --pixel:'Press Start 2P', 'Courier New', monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--frame); color:var(--ink); font-family:var(--pixel);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  box-sizing:border-box; padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
#wrap{position:relative; max-width:100%; box-shadow:0 0 0 calc(var(--u)*2) var(--ink)}
canvas{image-rendering:pixelated}
#c{display:block; width:100%; height:100%; touch-action:none; user-select:none; -webkit-user-select:none}
#ui{position:absolute; inset:0; pointer-events:none}
button,a.go{font-family:var(--pixel); cursor:pointer; border:calc(var(--u)*1.5) solid var(--ink); color:var(--ink); background:var(--paper); text-decoration:none}
button:active,a.go:active{transform:translate(var(--u),var(--u))}
button:focus-visible,a.go:focus-visible{outline:calc(var(--u)*1.5) dashed var(--ink); outline-offset:calc(var(--u)*1.5)}
button:disabled{cursor:default; transform:none}

.panel{
  position:absolute; left:calc(var(--u)*8); right:calc(var(--u)*8); top:calc(var(--u)*7);
  pointer-events:auto; background:var(--paper); color:var(--ink);
  border:calc(var(--u)*2) solid var(--ink); box-shadow:calc(var(--u)*3) calc(var(--u)*3) 0 var(--ink);
  padding:calc(var(--u)*6) calc(var(--u)*6); display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*5); text-align:center;
}
h1,h2{margin:0; font-weight:400; line-height:1.1; letter-spacing:.04em}
h1{font-size:calc(var(--u)*12); text-shadow:var(--u) var(--u) 0 var(--accent)}
h2{font-size:calc(var(--u)*8)}
.wallet{display:inline-flex; align-items:center; gap:calc(var(--u)*2.5); font-size:calc(var(--u)*5); font-variant-numeric:tabular-nums}
.c{display:inline-block; width:calc(var(--u)*4.5); height:calc(var(--u)*4.5); background:var(--coin); border:var(--u) solid var(--coin-edge); box-shadow:inset var(--u) var(--u) 0 #fff3a8; flex:none}
.picker{display:flex; flex-direction:column; gap:calc(var(--u)*2.5); width:100%}
.lbl{font-size:calc(var(--u)*3.5); letter-spacing:.12em; color:var(--accent)}
.row{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:calc(var(--u)*3)}
.val{font-size:calc(var(--u)*4.5); line-height:1.5; min-width:0; overflow-wrap:anywhere}
.arr{width:calc(var(--u)*12); height:calc(var(--u)*12); font-size:calc(var(--u)*5); padding:0; line-height:1}
.go{font-size:calc(var(--u)*5.5); padding:calc(var(--u)*4) calc(var(--u)*8); background:var(--ink); color:var(--paper); box-shadow:var(--u) var(--u) 0 var(--accent); display:inline-block}
.go.alt{background:var(--paper); color:var(--ink)}
.btns{display:flex; gap:calc(var(--u)*4); flex-wrap:wrap; justify-content:center}
.score{font-size:calc(var(--u)*5); line-height:1.7; font-variant-numeric:tabular-nums}
.corner{position:absolute; bottom:calc(var(--u)*6); pointer-events:auto; font-size:calc(var(--u)*4); padding:calc(var(--u)*3.5) calc(var(--u)*4); box-shadow:var(--u) var(--u) 0 var(--ink)}
#boardBtn{left:calc(var(--u)*6)} #shopBtn{right:calc(var(--u)*6)}

/* друзья на главном экране */
#friends{position:absolute; left:calc(var(--u)*6); right:calc(var(--u)*6); bottom:calc(var(--u)*24); pointer-events:auto;
  display:flex; justify-content:center; gap:calc(var(--u)*4)}
.fr{display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*1.5); background:none; border:0; padding:0; color:var(--ink)}
.av{width:calc(var(--u)*15); height:calc(var(--u)*15); border-radius:50%; border:calc(var(--u)*1.2) solid var(--ink);
  display:flex; align-items:center; justify-content:center; font-size:calc(var(--u)*5); color:#fff; overflow:hidden; box-sizing:border-box; flex:none}
.av img{width:100%; height:100%; object-fit:cover}
.av.add{background:var(--paper); color:var(--ink); font-size:calc(var(--u)*6)}
.fs{font-size:calc(var(--u)*2.9); background:var(--paper); color:var(--ink); padding:calc(var(--u)*.8) calc(var(--u)*1.5); font-variant-numeric:tabular-nums; line-height:1.4}

/* листы магазина и рейтинга: нейтральная палитра */
.sheet{position:absolute; inset:calc(var(--u)*5); pointer-events:auto; background:var(--s-paper); color:var(--s-ink);
  border:calc(var(--u)*2) solid var(--s-ink); box-shadow:calc(var(--u)*3) calc(var(--u)*3) 0 var(--s-ink);
  display:flex; flex-direction:column; min-height:0;
  --ink:var(--s-ink); --paper:var(--s-paper); --accent:var(--s-accent)}
.sheet-h{display:flex; align-items:center; justify-content:space-between; gap:calc(var(--u)*3); padding:calc(var(--u)*4) calc(var(--u)*5) calc(var(--u)*3)}
.sheet-h h2{font-size:calc(var(--u)*5.5)}
.x{width:calc(var(--u)*11); height:calc(var(--u)*11); font-size:calc(var(--u)*4.5); padding:0}
.pvbox{display:grid; grid-template-columns:auto minmax(0,1fr); gap:calc(var(--u)*5); padding:0 calc(var(--u)*5) calc(var(--u)*4); align-items:center}
#pv{width:calc(var(--u)*45); height:calc(var(--u)*80); border:calc(var(--u)*1.5) solid var(--s-ink); display:block; background:#000}
.pvinfo{display:flex; flex-direction:column; gap:calc(var(--u)*3.5); min-width:0}
#pvName{font-size:calc(var(--u)*4.6); line-height:1.4; overflow-wrap:anywhere}
#pvDesc{font-size:calc(var(--u)*3.1); line-height:1.75; color:var(--s-muted)}
#pvBuy{font-size:calc(var(--u)*4); padding:calc(var(--u)*3.5) calc(var(--u)*3); background:var(--s-ink); color:var(--s-paper); display:inline-flex; align-items:center; justify-content:center; gap:calc(var(--u)*2); box-shadow:var(--u) var(--u) 0 var(--s-accent)}
#pvBuy.owned{background:var(--s-card); color:var(--s-ink)}
.tabs{display:flex; gap:calc(var(--u)*2); padding:0 calc(var(--u)*5)}
.tab{flex:1; font-size:calc(var(--u)*3.8); padding:calc(var(--u)*3) 0; background:var(--s-card)}
.tab[aria-selected="true"]{background:var(--s-ink); color:var(--s-paper)}
.grid{flex:1; min-height:0; overflow-y:auto; padding:calc(var(--u)*4) calc(var(--u)*5) calc(var(--u)*5); display:grid; gap:calc(var(--u)*3);
  grid-template-columns:repeat(3,minmax(0,1fr)); align-content:start}
.card{display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*1.5); padding:calc(var(--u)*2);
  font-size:calc(var(--u)*2.9); line-height:1.5; text-align:center; background:var(--s-card); min-width:0; border-color:transparent; border-width:calc(var(--u)*1.2)}
.card canvas{width:100%; aspect-ratio:1; max-width:100%; display:block}
.card.hero canvas{width:72%}
.card .nm{overflow-wrap:anywhere; min-height:3em}
.card .pr{display:inline-flex; align-items:center; gap:var(--u); font-variant-numeric:tabular-nums; color:var(--s-muted)}
.card .pr .c{width:calc(var(--u)*3); height:calc(var(--u)*3); border-width:calc(var(--u)*.7)}
.card.sel{border-color:var(--s-ink)}
.card.eq .pr{color:var(--s-accent)}
.star{color:#c98a00}
.foot{display:flex; justify-content:space-between; align-items:center; gap:calc(var(--u)*3); padding:calc(var(--u)*2) calc(var(--u)*5) calc(var(--u)*3.5); font-size:calc(var(--u)*2.8); line-height:1.6; color:var(--s-muted)}
.foot button{font-size:calc(var(--u)*2.8); padding:calc(var(--u)*2) calc(var(--u)*3)}

.board{flex:1; min-height:0; overflow-y:auto; padding:calc(var(--u)*2) calc(var(--u)*5); display:flex; flex-direction:column; gap:calc(var(--u)*1.5)}
.lr{display:grid; grid-template-columns:calc(var(--u)*8) auto 1fr auto; gap:calc(var(--u)*3); align-items:center; font-size:calc(var(--u)*3.4); padding:calc(var(--u)*2) calc(var(--u)*3); border:var(--u) solid transparent; font-variant-numeric:tabular-nums; background:var(--s-card)}
.lr .av{width:calc(var(--u)*10); height:calc(var(--u)*10); font-size:calc(var(--u)*3.5); border-width:var(--u)}
.lr .nm{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lr.me{background:var(--s-ink); color:var(--s-paper)}
.lr.bump{border-color:var(--s-accent)}
.live{display:inline-flex; align-items:center; gap:calc(var(--u)*2); font-size:calc(var(--u)*3); color:var(--s-accent)}
.live i{width:calc(var(--u)*2.5); height:calc(var(--u)*2.5); background:#e83a3a; animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.board-f{display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*3); padding:calc(var(--u)*4) calc(var(--u)*5) calc(var(--u)*5)}
.note{font-size:calc(var(--u)*2.8); line-height:1.7; color:var(--s-muted); text-align:center}

#toast{position:absolute; left:50%; bottom:calc(var(--u)*48); transform:translateX(-50%); width:max-content; max-width:80%;
  background:var(--s-ink); color:var(--s-paper); font-size:calc(var(--u)*3.4); line-height:1.6; text-align:center; padding:calc(var(--u)*3) calc(var(--u)*4);
  border:var(--u) solid var(--s-paper); pointer-events:none; z-index:5}
@media (prefers-reduced-motion:reduce){ .live i{animation:none} }
</style>
<style>body{margin:0;font-size:14px} [hidden]{display:none!important} *{-webkit-tap-highlight-color:transparent}</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="180" height="320" aria-label="Игровое поле"></canvas>
  <div id="ui">
    <div class="panel" id="menu">
      <h1>SKYHOOP</h1>
      <div class="wallet"><span class="c"></span><span id="mCoins">0</span></div>
      <div class="picker">
        <div class="lbl">ФОН</div>
        <div class="row">
          <button class="arr" id="wPrev" type="button" aria-label="Предыдущий фон">&lt;</button>
          <div class="val" id="wName"></div>
          <button class="arr" id="wNext" type="button" aria-label="Следующий фон">&gt;</button>
        </div>
      </div>
      <div class="picker">
        <div class="lbl">ГЕРОЙ</div>
        <div class="row">
          <button class="arr" id="hPrev" type="button" aria-label="Предыдущий герой">&lt;</button>
          <div class="val" id="hName"></div>
          <button class="arr" id="hNext" type="button" aria-label="Следующий герой">&gt;</button>
        </div>
      </div>
      <button class="go" id="startBtn" type="button">СТАРТ</button>
    </div>

    <div class="panel" id="over" hidden>
      <h2 id="overTitle">ПАДЕНИЕ!</h2>
      <div class="score" id="res"></div>
      <div class="btns">
        <button class="go" id="againBtn" type="button">ЕЩЁ РАЗ</button>
        <button class="go alt" id="menuBtn" type="button">МЕНЮ</button>
      </div>
    </div>

    <div id="friends" aria-label="Друзья в игре"></div>
    <button class="corner" id="boardBtn" type="button">РЕЙТИНГ</button>
    <button class="corner" id="shopBtn" type="button">МАГАЗИН</button>

    <div class="sheet" id="shop" hidden>
      <div class="sheet-h">
        <h2>МАГАЗИН</h2>
        <div class="wallet"><span class="c"></span><span id="sCoins">0</span></div>
        <button class="x" id="shopClose" type="button" aria-label="Закрыть магазин">X</button>
      </div>
      <div class="pvbox">
        <canvas id="pv" width="180" height="320" aria-label="Предпросмотр"></canvas>
        <div class="pvinfo">
          <div id="pvName"></div>
          <div id="pvDesc"></div>
          <button id="pvBuy" type="button"></button>
        </div>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab" id="tabW" role="tab" type="button" aria-selected="true">ФОНЫ</button>
        <button class="tab" id="tabH" role="tab" type="button" aria-selected="false">ГЕРОИ</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="foot">
        <span>★ = Telegram Stars</span>
        <button id="cheat" type="button">ТЕСТ +100</button>
      </div>
    </div>

    <div class="sheet" id="board" hidden>
      <div class="sheet-h">
        <h2>РЕЙТИНГ</h2>
        <span class="live"><i></i>LIVE</span>
        <button class="x" id="boardClose" type="button" aria-label="Закрыть рейтинг">X</button>
      </div>
      <div class="board" id="rows"></div>
      <div class="board-f">
        <a class="go" id="invite" href="https://t.me/share/url?url=https%3A%2F%2Ft.me%2Farcadejar_bot%3Fstartapp%3Dskyhoop&text=%D0%9F%D0%BE%D0%B1%D0%B5%D0%B9%20%D0%BC%D0%BE%D0%B9%20%D1%80%D0%B5%D0%BA%D0%BE%D1%80%D0%B4%20%D0%B2%20SKYHOOP!" target="_blank" rel="noopener">ПОЗВАТЬ ДРУЗЕЙ</a>
        <div class="note">Друзья именно в SKYHOOP.<br>Демо-данные, в Telegram — настоящие</div>
      </div>
    </div>

    <div id="toast" hidden></div>
  </div>
</div>

<script>

   Открытая отдельно (без хаба) игра работает локально — для разработки.
   ===================================================================== */
const GAME_ID = 'skyhoop';
const W = 180, H = 320;

const ECON = { targetPerMin: 2.5, spawnPerMin: 4, budgetCap: 2 };

const RAMP = { seconds: 240, maxBoost: 0.7 };

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const $ = id => document.getElementById(id);
const wrap = $('wrap');

  const c = document.createElement('canvas'); c.width = 12; c.height = 12;
  const g = c.getContext('2d');
  rows.forEach((r, j) => [...r].slice(0,12).forEach((ch, i) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(i, j, 1, 1); } }));

}

  // ---- ретро и мемы ----

function rnd(seed){ return () => (seed = (seed*16807) % 2147483647) / 2147483647; }
const hash = n => { const s = Math.sin(n*12.9898)*43758.5453; return s - Math.floor(s); };
let ctx2;
function cloud(x, y, fill, edge){
  const r = (a,b,w,h,c) => { ctx2.fillStyle = c; ctx2.fillRect(x+a, y+b, w, h); };
  r(4,0,10,1,edge); r(2,1,14,1,edge); r(0,2,22,6,edge);
  r(5,1,8,1,fill); r(3,2,12,1,fill); r(1,3,20,4,fill); r(2,7,18,1,fill);
}
function dither(y0, y1, c1, c2){
  const bayer = [0,2,3,1];
  for (let y=y0; y<y1; y++){ const t = (y-y0)/(y1-y0);
    for (let x=0; x<W; x++){ ctx2.fillStyle = t*4 > bayer[(y%2)*2 + x%2] + 0.5 ? c2 : c1; ctx2.fillRect(x,y,1,1); } }
}
function bands(y0, y1, cols){ const h = (y1-y0)/(cols.length-1);
  for (let i=0;i<cols.length-1;i++) dither(Math.round(y0+i*h), Math.round(y0+(i+1)*h), cols[i], cols[i+1]); }
function disc(cx, cy, r, col){ ctx2.fillStyle = col; for (let dy=-r; dy<=r; dy++) for (let dx=-r; dx<=r; dx++) if (dx*dx+dy*dy<=r*r) ctx2.fillRect(cx+dx, cy+dy, 1, 1); }
function rain(g, t, col, n){ g.fillStyle = col;
  for (let i=0;i<n;i++){ const sp = 120 + (i*37)%60, x = (i*53 + t*30) % (W+20) - 10, y = ((i*97) + t*sp) % (H+20) - 10; g.fillRect(Math.round(x), Math.round(y), 1, 3); } }
const noop = () => {};
const PL = (n, m, b) => ({ normal:{top:n[0],body:n[1],edge:n[2]}, move:{top:m[0],body:m[1],edge:m[2]}, brk:{top:b[0],body:b[1],edge:b[2]} });

  for (const id of r.owned || []){
    if (WORLDS.some(w => w.id === id) && !P.owned.w.includes(id)) P.owned.w.push(id);
    if (HEROES.some(h => h.id === id) && !P.owned.h.includes(id)) P.owned.h.push(id);
  }
  const d = r.data || {};
  if (d.world && P.owned.w.includes(d.world)) P.world = d.world;
  if (d.hero && P.owned.h.includes(d.hero)) P.hero = d.hero;
}
const savePrefs = () => Hub.save({ world:P.world, hero:P.hero });

// ================= UI =================
const isOwned = it => (it.kind === 'w' ? P.owned.w : P.owned.h).includes(it.id);
const ownedList = kind => (kind === 'w' ? WORLDS : HEROES).filter(isOwned);
function refreshUI(){
  const w = byId(WORLDS, P.world), rs = document.documentElement.style;
  for (const k in w.ui) rs.setProperty('--' + k, w.ui[k]);
  $('wName').textContent = w.name; $('hName').textContent = byId(HEROES, P.hero).name;
  $('mCoins').textContent = P.coins; $('sCoins').textContent = P.coins;
  if (!$('shop').hidden) renderShop();
  renderFriends();
}
function cycle(kind, d){
  const list = ownedList(kind), key = kind === 'w' ? 'world' : 'hero';
  const i = list.findIndex(x => x.id === P[key]);
  P[key] = list[(i + d + list.length) % list.length].id; savePrefs(); refreshUI();
}
$('wPrev').onclick = () => cycle('w', -1); $('wNext').onclick = () => cycle('w', 1);
$('hPrev').onclick = () => cycle('h', -1); $('hNext').onclick = () => cycle('h', 1);

let toastT;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1800); }

// ---- друзья и рейтинг ЭТОЙ игры (приходят из хаба, обновляются вживую) ----
let FRIENDS = [], BOARD = [], bumpedId = null;
const esc = s => String(s).replace(/[<>&"]/g, '');
function avatar(f){ return f.photo ? `<span class="av"><img src="${esc(f.photo)}" alt=""></span>` : `<span class="av" style="background:${esc(f.c || '#16121c')}">${esc((f.n || '?')[0])}</span>`; }
function renderFriends(){
  $('friends').innerHTML = FRIENDS.slice(0, 4).map(f => `<button class="fr" type="button" title="${esc(f.n)}">${avatar(f)}<span class="fs">${f.s}</span></button>`).join('')
    + `<button class="fr" type="button" id="addFriend" aria-label="Пригласить друга"><span class="av add">+</span><span class="fs">ЗВАТЬ</span></button>`;
  $('friends').querySelectorAll('.fr').forEach(b => b.onclick = b.id === 'addFriend' ? invite : openBoard);
}
function renderBoard(){
  $('rows').innerHTML = BOARD.map((r,i) => `<div class="lr${r.me?' me':''}${r.id===bumpedId?' bump':''}"><span>${i+1}</span>${avatar(r)}<span class="nm">${esc(r.n)}</span><span>${r.s}</span></div>`).join('');
}
async function loadSocial(){ FRIENDS = await Hub.friends(); BOARD = await Hub.leaderboard(); renderFriends(); renderBoard(); }
Hub.on('leaderboard', d => { FRIENDS = d.friends; BOARD = d.board; bumpedId = d.bumped; renderFriends(); renderBoard(); });
function openBoard(){ closeSheets(); $('board').hidden = false; renderBoard(); }
function invite(){ Hub.invite(); }
$('invite').addEventListener('click', e => { e.preventDefault(); invite(); });

// ---- магазин ----
let shopTab = 'w', pvItem = null;
function thumb(it){
  const c = document.createElement('canvas');
  if (it.kind === 'h'){ c.width = 16; c.height = 16; c.getContext('2d').drawImage(it.spr, 2, 2); return c; }
  c.width = 60; c.height = 60; const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  const [tx, ty] = it.thumb || [60, 120];
  g.drawImage(it.tile, tx, ty, 60, 60, 0, 0, 60, 60);
  drawPlat(g, {x:15, y:44, type:'normal', spring:false, broken:false}, it);
  return c;
}
function priceHTML(it){
  if (it.id === (it.kind === 'w' ? P.world : P.hero)) return 'ВЫБРАН';
  if (isOwned(it)) return 'ЕСТЬ';
  return it.cur === 'star' ? `<span class="star">★</span>${it.price}` : `<span class="c"></span>${it.price}`;
}
function renderShop(){
  const grid = $('grid'), list = shopTab === 'w' ? WORLDS : HEROES, cur = shopTab === 'w' ? P.world : P.hero;
  if (!pvItem || pvItem.kind !== shopTab) pvItem = byId(list, cur);
  $('tabW').setAttribute('aria-selected', shopTab === 'w'); $('tabH').setAttribute('aria-selected', shopTab === 'h');
  grid.innerHTML = '';
  for (const it of list){
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'card' + (it.kind === 'h' ? ' hero' : '') + (it === pvItem ? ' sel' : '') + (it.id === cur ? ' eq' : '');
    b.appendChild(thumb(it));
    b.insertAdjacentHTML('beforeend', `<div class="nm">${esc(it.name)}</div><div class="pr">${priceHTML(it)}</div>`);
    b.onclick = () => { pvItem = it; renderShop(); };
    grid.appendChild(b);
  }
  renderPv();
}
function renderPv(){
  const it = pvItem, btn = $('pvBuy');
  $('pvName').textContent = it.name; $('pvDesc').textContent = it.desc;
  const eq = it.id === (it.kind === 'w' ? P.world : P.hero);
  btn.disabled = eq; btn.className = isOwned(it) ? 'owned' : '';
  btn.innerHTML = eq ? 'ВЫБРАН' : isOwned(it) ? 'ВЫБРАТЬ'
    : it.cur === 'star' ? `КУПИТЬ <span class="star">★</span>${it.price}` : `КУПИТЬ <span class="c"></span>${it.price}`;
}
function equip(it){ if (it.kind === 'w') P.world = it.id; else P.hero = it.id; savePrefs(); refreshUI(); }
$('pvBuy').onclick = async () => {
  const it = pvItem;
  if (isOwned(it)) { equip(it); return; }
  // Хаб сам решает, как платить: монеты этой игры или Telegram Stars.
  const r = await Hub.buy({ id:it.id, cur:it.cur, price:it.price, title:it.name });
  if (!r.ok){ toast(r.message); return; }
  P.coins = r.coins; (it.kind === 'w' ? P.owned.w : P.owned.h).push(it.id);
  equip(it); toast(`Куплено: ${it.name}`);
};
$('tabW').onclick = () => { shopTab = 'w'; pvItem = null; renderShop(); };
$('tabH').onclick = () => { shopTab = 'h'; pvItem = null; renderShop(); };
$('cheat').onclick = () => { Hub.earn(100); Hub.flush(); P.coins += 100; refreshUI(); toast('+100 тестовых монет'); };

function closeSheets(){ $('shop').hidden = true; $('board').hidden = true; }
$('shopBtn').onclick = () => { closeSheets(); pvItem = null; $('shop').hidden = false; renderShop(); };
$('boardBtn').onclick = openBoard;
$('shopClose').onclick = closeSheets; $('boardClose').onclick = closeSheets;
function setHome(show, friends){ $('shopBtn').hidden = !show; $('boardBtn').hidden = !show; $('friends').hidden = !friends; }

// ================= МАСШТАБ =================
function fit(){
  const aw = document.body.clientWidth - 32, ah = innerHeight - 24;
  let s = Math.min(aw / W, ah / H); if (s >= 2) s = Math.floor(s);
  wrap.style.width = W*s + 'px'; wrap.style.height = H*s + 'px';
  document.documentElement.style.setProperty('--u', s + 'px');
}
addEventListener('resize', fit); fit();

// ================= ИГРА =================
const G = 0.19, JUMP = -5.6, SPRING = -8.8, PW = 30, PH = 6;
let state = 'menu', player, plats, score, topY, camTotal, squash, sessionT = 0, budget = 0, runCoins = 0, pops = [];

const speed = () => 1 + Math.min(sessionT / RAMP.seconds, 1) * RAMP.maxBoost;
const level = () => Math.min(sessionT / RAMP.seconds, 1);

function newPlat(y){
  const lvl = level(), r = Math.random();
  let type = 'normal';
  if (r < 0.10 + lvl*0.18) type = 'move';
  else if (r < 0.18 + lvl*0.26) type = 'brk';
  const p = {x: Math.floor(Math.random()*(W-PW)), y, type, vx:0, broken:false, vy:0, sep:0, spring:false, coin:false};
  if (type === 'move') p.vx = (Math.random()<.5?-1:1) * (0.5 + lvl*0.9);
  if (type === 'normal' && Math.random() < 0.07) p.spring = true;
  return p;
}
function addNext(){
  topY -= 29 + level()*24 + Math.random()*9;
  const p = newPlat(topY); plats.push(p);
  if (state === 'play' && budget >= 1 && p.type !== 'brk' && !p.spring){ p.coin = true; budget -= 1; }
  if (p.type === 'brk'){ const s = newPlat(topY - 4); s.type = 'normal'; s.vx = 0; s.spring = false; plats.push(s); }
}
function reset(){
  score = 0; camTotal = 0; squash = 0; sessionT = 0; budget = 0; runCoins = 0; pops = [];
  const base = state === 'play' ? H - 24 : H - 66;   // в меню герой прыгает выше, над друзьями
  player = {x: W/2-6, y: base - 12, vx:0, vy:JUMP, face:1};
  plats = [{x: W/2-15, y: base, type:'normal', vx:0, broken:false, vy:0, sep:0, spring:false, coin:false}];
  topY = base;
  if (state === 'play') while (topY > -20) addNext();
}

const keys = {l:false, r:false, tl:false, tr:false};
const isL = k => ['ArrowLeft','a','A','ф','Ф'].includes(k), isR = k => ['ArrowRight','d','D','в','В'].includes(k);
addEventListener('keydown', e => {
  if (isL(e.key)) keys.l = true; if (isR(e.key)) keys.r = true;
  if (e.key === 'Escape') closeSheets();
  if (e.key === 'Enter' && state === 'menu' && $('shop').hidden && $('board').hidden && document.activeElement?.tagName !== 'BUTTON') start();
});
addEventListener('keyup', e => { if (isL(e.key)) keys.l = false; if (isR(e.key)) keys.r = false; });
const ptrs = new Map();
const side = e => { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) < r.width/2 ? 'l' : 'r'; };
const sync = () => { const v = [...ptrs.values()]; keys.tl = v.includes('l'); keys.tr = v.includes('r'); };
cv.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, side(e)); sync(); });
cv.addEventListener('pointermove', e => { if (ptrs.has(e.pointerId)) { ptrs.set(e.pointerId, side(e)); sync(); } });
['pointerup','pointercancel','pointerleave'].forEach(t => cv.addEventListener(t, e => { ptrs.delete(e.pointerId); sync(); }));

function update(k, dtSec){
  const playing = state === 'play';
  if (playing){ sessionT += dtSec; budget = Math.min(ECON.budgetCap, budget + dtSec * ECON.spawnPerMin / 60); k *= speed(); }
  const dir = playing ? ((keys.l||keys.tl ? -1 : 0) + (keys.r||keys.tr ? 1 : 0)) : 0;
  player.vx += (dir*2.6 - player.vx) * Math.min(1, 0.22 * k);
  if (Math.abs(player.vx) > 0.3) player.face = Math.sign(player.vx);
  player.x += player.vx * k;
  if (player.x + 6 < 0) player.x = W - 6;
  if (player.x + 6 > W) player.x = -6;

  const prevBottom = player.y + 12;
  player.vy += G * k; player.y += player.vy * k;
  squash = Math.max(0, squash - 0.1*k);

  for (const p of plats){
    if (p.type === 'move'){ p.x += p.vx*k; if (p.x < 0 || p.x + PW > W) p.vx *= -1; }
    if (p.broken){ p.vy += G*k; p.y += p.vy*k; p.sep += 0.4*k; continue; }
    const bottom = player.y + 12;
    if (player.vy > 0 && prevBottom <= p.y + 1 && bottom >= p.y && player.x + 9 > p.x && player.x + 3 < p.x + PW){
      if (p.type === 'brk'){ p.broken = true; continue; }
      player.y = p.y - 12;
      player.vy = (p.spring && Math.abs(player.x + 6 - (p.x + PW/2)) < 8) ? SPRING : JUMP;
      squash = 1;
    }
    if (p.coin){ const cx = p.x + PW/2 - 3, cy = p.y - 10;
      if (player.x + 11 > cx && player.x + 1 < cx + 7 && player.y + 12 > cy && player.y < cy + 7){
        p.coin = false; P.coins++; runCoins++; Hub.earn(1); pops.push({x:cx, y:cy, life:1}); } }
  }
  for (const pp of pops){ pp.y -= 0.5*k; pp.life -= 0.025*k; }
  pops = pops.filter(pp => pp.life > 0);

  if (playing){
    const line = H * 0.4;
    if (player.y < line){ const d = line - player.y; player.y = line; score += d; topY += d; camTotal += d;
      for (const p of plats) p.y += d; for (const pp of pops) pp.y += d; }
    plats = plats.filter(p => p.y < H + 20);
    while (topY > -20) addNext();
  }
  if (player.y > H + 4) playing ? gameOver() : reset();
}

// ================= ОТРИСОВКА =================
function drawCoin(g, x, y, t){
  const wd = [7,5,3,5][Math.floor(t*6) % 4], ox = Math.round(x + (7-wd)/2), oy = Math.round(y);
  g.fillStyle = '#6b4a10'; g.fillRect(ox+1, oy, wd-2, 7); g.fillRect(ox, oy+1, wd, 5);
  g.fillStyle = '#ffd84a'; g.fillRect(ox+1, oy+1, wd-2, 5);
  if (wd > 3){ g.fillStyle = '#fff3a8'; g.fillRect(ox+1, oy+1, 1, 2); }
}
function drawPlat(g, p, w){
  const c = w.plat[p.type], x = Math.round(p.x), y = Math.round(p.y);
  const half = (ox, wd) => { g.fillStyle = c.edge; g.fillRect(ox, y, wd, PH); g.fillStyle = c.body; g.fillRect(ox+1, y+1, wd-2, PH-2); g.fillStyle = c.top; g.fillRect(ox+1, y+1, wd-2, 1); };
  if (p.broken){ const s = Math.round(p.sep); half(x - s, 15); half(x + 15 + s, 15); return; }
  half(x, PW); w.deco(g, x, y, p);
  if (p.type === 'brk'){ g.fillStyle = c.edge; g.fillRect(x+14,y+1,1,2); g.fillRect(x+15,y+3,1,1); g.fillRect(x+14,y+4,1,1); }
  if (p.type === 'move'){ g.fillStyle = c.edge; g.fillRect(x+3,y+2,1,2); g.fillRect(x+2,y+3,1,1); g.fillRect(x+26,y+2,1,2); g.fillRect(x+27,y+3,1,1); }
  if (p.spring){ const sx = x + 12, sy = y - 5;
    g.fillStyle = w.spring[1]; g.fillRect(sx+1, sy+2, 4, 1); g.fillRect(sx+1, sy+4, 4, 1); g.fillRect(sx, sy+3, 1, 1); g.fillRect(sx+5, sy+3, 1, 1);
    g.fillStyle = w.spring[0]; g.fillRect(sx-1, sy, 8, 2); }
}
const fxc = document.createElement('canvas'); fxc.width = 12; fxc.height = 12; const fxg = fxc.getContext('2d');
function heroImage(h, t){
  if (h.fx !== 'shine') return h.spr;
  fxg.globalCompositeOperation = 'source-over'; fxg.clearRect(0,0,12,12); fxg.drawImage(h.spr, 0, 0);
  fxg.globalCompositeOperation = 'source-atop'; fxg.fillStyle = 'rgba(255,255,255,.85)';
  const pos = Math.floor((t*14) % 36) - 12; for (let j=0;j<12;j++) fxg.fillRect(pos + j, 11 - j, 2, 1);
  fxg.globalCompositeOperation = 'source-over'; return fxc;
}
function drawHero(g, h, x, y, face, t){
  const img = heroImage(h, t);
  if (h.fx === 'rainbow'){ const cols = ['#ff4a4a','#ff9a1f','#ffe14a','#4ad66a','#4a9aff','#9b5cff'];
    for (let i=0;i<6;i++){ g.fillStyle = cols[i]; for (let s=0;s<12;s+=2){ const tx = face < 0 ? x + 12 + s : x - 2 - s; g.fillRect(tx, y + 3 + i + (Math.floor(t*8 + s/2) % 2), 2, 1); } } }
  if (h.fx === 'ghost'){ y += Math.round(Math.sin(t*4)); g.globalAlpha = .85; }
  const blit = (dx, dy) => { if (face < 0){ g.save(); g.translate(dx + 12, dy); g.scale(-1, 1); g.drawImage(img, 0, 0); g.restore(); } else g.drawImage(img, dx, dy); };
  if (h.fx === 'glitch' && Math.random() < 0.18){
    g.globalAlpha = .6; blit(x - 1, y); g.globalAlpha = 1;
    const cut = 3 + Math.floor(Math.random()*6), sh = Math.random()<.5 ? -2 : 2;
    g.save(); g.beginPath(); g.rect(x-4, y, 20, cut); g.clip(); blit(x + sh, y); g.restore();
    g.save(); g.beginPath(); g.rect(x-4, y+cut, 20, 12-cut); g.clip(); blit(x, y); g.restore();
  } else blit(x, y);
  g.globalAlpha = 1;
  if (h.fx === 'ghost'){ const n = Math.floor(t*3) % 4; g.fillStyle = '#5ad1ff';
    if (n>0) g.fillRect(x+5, y-2, 2, 1); if (n>1) g.fillRect(x+3, y-4, 6, 1); if (n>2) g.fillRect(x+1, y-6, 10, 1); }
  if (h.fx === 'halo' && Math.floor(t*4)%2){ g.fillStyle = '#fff6b0'; g.fillRect(x+2, y+1, 1, 1); g.fillRect(x+9, y+1, 1, 1); }
  if (h.fx === 'saber'){ const hx = face < 0 ? x : x + 11, len = 7 + (Math.floor(t*10) % 2);
    g.fillStyle = '#5ad1ff'; g.fillRect(hx - 1, y + 7 - len, 3, len); g.fillStyle = '#ffffff'; g.fillRect(hx, y + 7 - len, 1, len); g.fillStyle = '#8a8a8a'; g.fillRect(hx, y + 7, 1, 2); }
}
function drawWorld(g, w, t, scroll){
  if (w.fixed) g.drawImage(w.tile, 0, 0);
  else { const off = Math.floor(scroll) % H; g.drawImage(w.tile, 0, off); g.drawImage(w.tile, 0, off - H); }
  if (w.anim) w.anim(g, t);
}

function draw(t){
  const w = byId(WORLDS, P.world);
  drawWorld(ctx, w, t, camTotal * 0.35);
  for (const p of plats){ drawPlat(ctx, p, w); if (p.coin && !p.broken) drawCoin(ctx, p.x + PW/2 - 3, p.y - 10, t + p.x*0.01); }
  const h = byId(HEROES, P.hero), px = Math.round(player.x), py = Math.round(player.y) + (squash > 0.5 ? 1 : 0);
  drawHero(ctx, h, px, py, player.face, t);
  if (px < 0) drawHero(ctx, h, px + W, py, player.face, t);
  if (px + 12 > W) drawHero(ctx, h, px - W, py, player.face, t);

  ctx.font = "8px 'Press Start 2P', monospace"; ctx.textBaseline = 'top';
  for (const pp of pops){ ctx.globalAlpha = Math.max(0, pp.life); ctx.fillStyle = '#16121c'; ctx.fillText('+1', Math.round(pp.x)+1, Math.round(pp.y)+1); ctx.fillStyle = '#ffd84a'; ctx.fillText('+1', Math.round(pp.x), Math.round(pp.y)); }
  ctx.globalAlpha = 1;
  if (state === 'play'){
    const txt = (s, x, y) => { ctx.fillStyle = w.ui.paper; ctx.fillText(s, x+1, y+1); ctx.fillStyle = w.ui.ink; ctx.fillText(s, x, y); };
    txt(String(Math.floor(score/5)), 6, 6);
    const cs = String(P.coins), cx = W - 6 - cs.length*8; txt(cs, cx, 6); drawCoin(ctx, cx - 10, 6, 0);
    const sp = 'x' + speed().toFixed(1); txt(sp, W - 6 - sp.length*8, 17);
  }
}

// ---- живой предпросмотр в магазине ----
const pv = $('pv'), pg = pv.getContext('2d'); pg.imageSmoothingEnabled = false;
const PV_PLATS = [{x:20,y:120,type:'normal'},{x:120,y:90,type:'move'},{x:100,y:180,type:'brk'},{x:30,y:250,type:'normal',spring:true},{x:75,y:220,type:'normal'}]
  .map(p => ({vx:0, broken:false, sep:0, spring:false, ...p}));
function drawPreview(t){
  const it = pvItem; if (!it) return;
  const w = it.kind === 'w' ? it : byId(WORLDS, P.world), h = it.kind === 'h' ? it : byId(HEROES, P.hero);
  drawWorld(pg, w, t, t*14);
  for (const p of PV_PLATS) drawPlat(pg, p, w);
  drawCoin(pg, 32, 108, t);
  const hy = Math.round(208 - Math.abs(Math.sin(t*2.6))*70);
  drawHero(pg, h, 84, hy, Math.sin(t*0.7) < 0 ? -1 : 1, t);
}

let last = 0;
function frame(ms){
  const t = ms / 1000, dt = last ? Math.min((ms - last) / 1000, 0.05) : 1/60; last = ms;
  const shopOpen = !$('shop').hidden;
  if (state !== 'over' && !shopOpen) update(dt * 60, dt);
  if (shopOpen) drawPreview(t); else draw(t);
  requestAnimationFrame(frame);
}

function start(){ closeSheets(); state = 'play'; reset(); $('menu').hidden = true; $('over').hidden = true; setHome(false, false); last = 0; }
function gameOver(){
  state = 'over';
  const s = Math.floor(score/5), rec = s > P.best;
  if (rec) P.best = s;
  Hub.submitRun({ score:s, duration:Math.round(sessionT) }).then(() => loadSocial());
  refreshUI();
  $('overTitle').textContent = rec ? 'РЕКОРД!' : 'ПАДЕНИЕ!';
  $('res').innerHTML = `ВЫСОТА ${s}<br>ЛУЧШЕЕ ${P.best}<br>МОНЕТЫ +${runCoins}`;
  $('over').hidden = false; setHome(true, false);
}
function toMenu(){ state = 'menu'; reset(); $('over').hidden = true; $('menu').hidden = false; setHome(true, true); }
$('startBtn').onclick = start; $('againBtn').onclick = start; $('menuBtn').onclick = toMenu;

refreshUI(); reset(); requestAnimationFrame(frame);
Hub.init(GAME_ID).then(r => {
  USER = r.user || USER; applyProfile(r);
  if (r.env === 'telegram') $('cheat').hidden = true;   // тестовые монеты только вне Telegram
  refreshUI(); loadSocial();
});
</script>
