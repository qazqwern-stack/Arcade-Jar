<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ORBIT PINBALL — Arcade Jar</title><meta name="theme-color" content="#0a1127"><script src="../../hub-sdk.js"></script><style>body{margin:0;background:#0a1127}</style></head><body>
<div id="orbit-pinball" aria-label="Orbit Pinball — классический пиксельный пинбол">
 <div class="op-cabinet">
  <header><div><span>ARCADE JAR / OBSERVATORY 84</span><h2>ORBIT <b>PINBALL</b></h2></div><button data-do="pause" aria-label="Пауза">Ⅱ</button></header>
  <div class="op-hud"><span class="op-lives" aria-label="Осталось шаров">● ● ●</span><strong class="op-score">000000</strong><span class="op-multi">×1</span></div>
  <div class="op-screen"><canvas width="320" height="550" aria-label="Удерживайте поле и отпустите для запуска. Во время игры левая и правая половины управляют флипперами.">Пиксельный стол с бамперами, флипперами и пружинным запуском</canvas><div class="op-toast" aria-live="polite"></div><div class="op-overlay"></div></div>

 </div>
</div>
<style>
#orbit-pinball{--op-bg:#0a1127;--op-panel:#17213c;--op-line:#354761;--op-text:#f4e6c6;--op-muted:#a3b5c9;--op-accent:#75e0cb;--op-gold:#ffd08a;color:var(--op-text);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:flex;justify-content:center;padding:12px 0 20px;user-select:none;-webkit-user-select:none}
#orbit-pinball *{box-sizing:border-box}#orbit-pinball .op-cabinet{width:min(100%,360px);background:var(--op-bg);padding:14px;border:2px solid var(--op-line);box-shadow:5px 5px 0 #060b18}#orbit-pinball header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}#orbit-pinball header span{font-size:8px;letter-spacing:1.4px;color:var(--op-muted)}#orbit-pinball h2{font:900 25px/1.1 ui-monospace,monospace;letter-spacing:-.8px;margin:4px 0 0}#orbit-pinball h2 b{color:var(--op-accent)}#orbit-pinball button{font:inherit;background:var(--op-panel);color:var(--op-text);border:2px solid var(--op-line);border-radius:0;min-height:44px;cursor:pointer;touch-action:none}#orbit-pinball button:hover{border-color:var(--op-accent)}#orbit-pinball button:focus-visible{outline:2px solid var(--op-gold);outline-offset:3px}#orbit-pinball button:active,#orbit-pinball button.op-held{transform:translateY(1px);background:#304b57}#orbit-pinball header button{width:44px;flex-shrink:0;font-size:19px}#orbit-pinball .op-hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;padding:6px 2px}#orbit-pinball .op-lives{font-size:12px;color:var(--op-accent);letter-spacing:2px;white-space:nowrap}#orbit-pinball .op-score{font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:1px}#orbit-pinball .op-multi{font-size:18px;color:var(--op-gold);min-width:40px;text-align:right}#orbit-pinball .op-screen{position:relative;background:var(--op-bg);overflow:hidden}#orbit-pinball canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:none}#orbit-pinball .op-toast{position:absolute;left:8px;right:8px;top:7px;text-align:center;pointer-events:none;font-size:10px;color:var(--op-gold);text-shadow:1px 1px #081123;min-height:16px}#orbit-pinball .op-status{display:flex;align-items:center;justify-content:space-between;gap:5px;min-height:34px;font-size:9px;color:var(--op-muted)}#orbit-pinball .op-save{color:var(--op-accent);text-align:right}#orbit-pinball small{display:block;font-size:9px;letter-spacing:.4px}#orbit-pinball footer{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-top:10px}#orbit-pinball footer button{font-size:8px;letter-spacing:.5px;min-height:33px;padding:5px;background:transparent;border-color:transparent;color:var(--op-muted)}#orbit-pinball .op-overlay{position:absolute;inset:0;background:#070d218c;display:flex;justify-content:center;align-items:center;padding:18px}#orbit-pinball .op-overlay[hidden]{display:none}#orbit-pinball .op-dialog{width:100%;max-height:100%;overflow:auto;background:#101b30f2;border:2px solid var(--op-line);padding:24px 16px;box-shadow:4px 4px 0 #050b1a;text-align:center}#orbit-pinball .op-dialog h3{font-size:28px;line-height:1.1;letter-spacing:-.8px;margin:4px 0 15px;color:var(--op-accent)}#orbit-pinball .op-dialog p{font-size:11px;line-height:1.8;color:var(--op-muted);margin:10px 0 15px}#orbit-pinball .op-dialog .op-eyebrow{font-size:8px;letter-spacing:2px;color:var(--op-gold);margin:0 0 8px}#orbit-pinball .op-dialog button{display:block;width:100%;font-size:12px;padding:10px;margin-top:9px}#orbit-pinball .op-dialog .op-primary{background:var(--op-gold);border-color:var(--op-gold);color:#172539;font-weight:700}#orbit-pinball .op-dialog .op-quiet{border-color:transparent;background:transparent;color:var(--op-muted)}@media(max-width:360px){#orbit-pinball .op-cabinet{padding:10px}#orbit-pinball h2{font-size:23px}#orbit-pinball .op-score{font-size:24px}#orbit-pinball .op-lives{font-size:10px;letter-spacing:1px}#orbit-pinball .op-dialog{padding:18px 12px}}
#orbit-pinball .op-menu-pair{display:flex;gap:6px}
#orbit-pinball .op-dialog{padding:18px 13px}#orbit-pinball .op-dialog h3{font-size:25px;margin-bottom:10px}
#orbit-pinball .op-dialog p{margin:6px 0 10px}#orbit-pinball .op-dialog button{padding:8px;margin-top:7px}
</style>
<script>
(()=>{
'use strict';
const root=document.getElementById('orbit-pinball'),$=s=>root.querySelector(s),cv=$('canvas'),g=cv.getContext('2d'),DT=1/240,R=4.2;
const palettes=[{name:'КОСМОС',bg:'#0a1127',field:'#112c49',deep:'#14213f',edge:'#75e0cb',gold:'#ffd08a',pink:'#e68da9',muted:'#6688a7',line:'#385772'},
 {name:'СЕВЕРНОЕ СИЯНИЕ',bg:'#091e27',field:'#154445',deep:'#132f3c',edge:'#9de9b7',gold:'#f1cc8e',pink:'#d19fd8',muted:'#6aaba5',line:'#386a6b'},
 {name:'МАРСИАНСКИЙ ЗАКАТ',bg:'#24142c',field:'#492c4c',deep:'#30203b',edge:'#a4b4ef',gold:'#ffc78c',pink:'#ef9199',muted:'#9e6d9c',line:'#715072'}];
let palette=0,best=0,phase='menu',paused=false,ball,balls=3,score=0,multiplier=1,charge=0,charging=false,ballSave=0,rush=0,clock=0,toast='',toastT=0,trail=[],fx=[],last=0,acc=0,shake=0,sound=false,audio=null,served=0;
let ready=false,savedRun=null,submitted=false,pending=Promise.resolve();

const controls={left:false,right:false},touches=new Map();
const outline=[[68,28],[240,28],[273,46],[298,80],[309,120],[309,494],[222,532],[98,532],[24,464],[24,346],[47,321],[47,282],[24,258],[24,90],[40,54],[68,28]];
const wall=(a,b,kind='rail')=>({ax:a[0],ay:a[1],bx:b[0],by:b[1],kind,cd:0});
const walls=[];for(let i=0;i<outline.length-1;i++)if(i!==6)walls.push(wall(outline[i],outline[i+1]));
walls.push(wall([286,111],[286,482]),wall([48,367],[48,416]),wall([48,416],[82,446]),wall([268,367],[268,416]),wall([268,416],[236,446]));
const orbitRails=[[[67,60],[48,83],[44,113],[44,245],[51,260],[56,253],[56,132],[72,103],[94,94],[94,76],[79,61]],[[229,60],[259,72],[275,101],[278,325],[267,337],[278,349],[282,106],[274,81],[253,63]]];
for(const pts of orbitRails)for(let i=0;i<pts.length;i++)walls.push(wall(pts[i],pts[(i+1)%pts.length],'orbit'));
const slingPolys=[[[77,345],[83,386],[106,405]],[[243,345],[237,386],[214,405]]];for(const pts of slingPolys)for(let j=0;j<3;j++)walls.push(wall(pts[j],pts[(j+1)%3],'sling'));
const bumpers=[{x:121,y:148,r:16,value:100,cd:0,flash:0},{x:205,y:148,r:16,value:200,cd:0,flash:0},{x:163,y:212,r:20,value:500,cd:0,flash:0}];
const posts=[{x:111,y:97,r:3},{x:145,y:97,r:3},{x:180,y:97,r:3},{x:214,y:97,r:3},{x:49,y:365,r:3},{x:267,y:365,r:3}];
const lanes=[{x:128,y:85,lit:false,cd:0},{x:163,y:85,lit:false,cd:0},{x:198,y:85,lit:false,cd:0}];
const targets=[...Array.from({length:3},(_,i)=>({x:76,y:180+i*24,side:1,lit:false,cd:0})),...Array.from({length:3},(_,i)=>({x:251,y:180+i*24,side:-1,lit:false,cd:0}))];
const standups=[111,145,179,213].map((x,i)=>({x,y:300,lit:false,cd:0,index:i}));
const spinner={x:239,y:264,angle:0,velocity:0,cd:0,flash:0};
const flippers=[{x:100,y:435,angle:.4,rest:.4,raised:-.65,side:1,omega:0,len:52},{x:220,y:435,angle:Math.PI-.4,rest:Math.PI-.4,raised:Math.PI+.65,side:-1,omega:0,len:52}];
function serial(fn){pending=pending.catch(e=>console.warn('pinball save queue',e)).then(fn);return pending;}
function snapshot(){
 if(!ready||!['ready','play'].includes(phase))return null;
 return{v:1,phase,profile:{best,palette},ball:{...ball},balls,score,multiplier,ballSave,rush,clock,served,submitted,
  bumpers:bumpers.map(o=>[o.cd,o.flash]),lanes:lanes.map(o=>[o.lit?1:0,o.cd]),targets:targets.map(o=>[o.lit?1:0,o.cd]),
  standups:standups.map(o=>[o.lit?1:0,o.cd]),wallCD:walls.map(o=>o.cd),flippers:flippers.map(f=>f.angle),
  spinner:{angle:spinner.angle,velocity:spinner.velocity,cd:spinner.cd,flash:spinner.flash}};
}
function validRun(s){
 const pairs=(a,n)=>Array.isArray(a)&&a.length===n&&a.every(o=>Array.isArray(o)&&o.length===2&&o.every(Number.isFinite));
 return !!(s&&s.v===1&&['ready','play'].includes(s.phase)&&s.ball&&['x','y','vx','vy'].every(k=>Number.isFinite(s.ball[k]))&&
 s.ball.x>=0&&s.ball.x<=320&&s.ball.y>=0&&s.ball.y<543&&Number.isInteger(s.balls)&&s.balls>=1&&s.balls<=3&&
 ['score','multiplier','ballSave','rush','clock','served'].every(k=>Number.isFinite(s[k])&&s[k]>=0)&&s.multiplier>=1&&s.multiplier<=5&&
 pairs(s.bumpers,3)&&pairs(s.lanes,3)&&pairs(s.targets,6)&&pairs(s.standups,4)&&
 Array.isArray(s.wallCD)&&s.wallCD.length===walls.length&&s.wallCD.every(Number.isFinite)&&Array.isArray(s.flippers)&&s.flippers.length===2&&s.flippers.every(Number.isFinite)&&
 s.spinner&&['angle','velocity','cd','flash'].every(k=>Number.isFinite(s.spinner[k])));
}
function remember(){
 best=Math.max(best,score);if(!ready)return;
 const data={profile:{best,palette},run:snapshot()||savedRun||null,savedAt:Date.now()};
 try{localStorage.setItem('orbitpinball_state',JSON.stringify(data));}catch(e){}
 return serial(()=>Hub.save(data));
}
function recordResult(value=score,duration=clock){if(!ready||submitted||value<=0)return;submitted=true;const run={score:Math.floor(value),duration:Math.round(duration)};serial(()=>Hub.submitRun(run));}
function resumeRun(){
 const s=savedRun;if(!validRun(s)){savedRun=null;start();return;}
 resetTable();ball={...s.ball};balls=s.balls;score=s.score;multiplier=s.multiplier;ballSave=s.phase==='play'?Math.max(.8,s.ballSave):s.ballSave;rush=s.rush;clock=s.clock;served=s.served;submitted=!!s.submitted;
 bumpers.forEach((o,i)=>{[o.cd,o.flash]=s.bumpers[i];});
 for(const [objects,values] of [[lanes,s.lanes],[targets,s.targets],[standups,s.standups]])objects.forEach((o,i)=>{o.lit=!!values[i][0];o.cd=values[i][1];});
 walls.forEach((o,i)=>o.cd=s.wallCD[i]);flippers.forEach((f,i)=>{f.angle=s.flippers[i];f.omega=0;});Object.assign(spinner,s.spinner);
 phase=s.phase;paused=false;savedRun=null;clearInput();hide();say('ПАРТИЯ ПРОДОЛЖЕНА');
}
async function showBoard(){
 phase='board';modal('<h3>РЕЙТИНГ</h3><p>Загрузка…</p><button data-do="menu">НАЗАД</button>');
 try{await pending;const rows=await Hub.leaderboard();if(phase!=='board')return;modal('<h3>РЕЙТИНГ</h3><div class="op-rows"></div><button data-do="invite">ПОЗВАТЬ ДРУГА</button><button data-do="menu" class="op-quiet">НАЗАД</button>');
 for(const [i,r] of rows.entries()){const row=document.createElement('p');row.textContent=(i+1)+'. '+r.n+' — '+r.s;$('.op-rows').appendChild(row);}}
 catch(e){if(phase==='board')modal('<h3>НЕТ СВЯЗИ</h3><button data-do="menu">НАЗАД</button>');}
}

function say(t,seconds=2.2){toast=t;toastT=seconds;$('.op-toast').textContent=t;}function clearInput(){touches.clear();controls.left=false;controls.right=false;charging=false;charge=0;root.querySelectorAll('.op-held').forEach(b=>b.classList.remove('op-held'));}
function modal(s){clearInput();$('.op-overlay').hidden=false;$('.op-overlay').innerHTML='<div class="op-dialog">'+s+'</div>';}function hide(){$('.op-overlay').hidden=true;$('.op-overlay').innerHTML='';}
function setPalette(n,persist=true){palette=(n+palettes.length)%palettes.length;const p=palettes[palette];root.style.setProperty('--op-bg',p.bg);root.style.setProperty('--op-accent',p.edge);root.style.setProperty('--op-gold',p.gold);root.style.setProperty('--op-line',p.line);$('[data-do=palette]').textContent='ПАЛИТРА: '+p.name;if(persist)remember();}
function beep(freq=.5,duration=.08,type='sine'){if(!sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),v=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(180+freq*500,t);o.frequency.exponentialRampToValueAtTime(100+freq*200,t+duration);v.gain.setValueAtTime(.045,t);v.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(v).connect(audio.destination);o.start(t);o.stop(t+duration+.02);}catch(e){sound=false;}}
function menu(){phase='menu';paused=false;ball={x:301,y:465,vx:0,vy:0,lane:true};score=0;balls=3;multiplier=1;resetTable();modal('<p class="op-eyebrow">НОЧНАЯ СМЕНА / ОБСЕРВАТОРИЯ 84</p><h3>ORBIT<br>PINBALL</h3><p>Поймай шар на флиппер.<br>Зажги орбиты. Разбуди сверхновую.</p>'+(savedRun?'<button class="op-primary" data-do="continue">ПРОДОЛЖИТЬ / '+savedRun.score+'</button>':'')+'<button class="op-primary" data-do="start">НОВАЯ ПАРТИЯ →</button><div class="op-menu-pair"><button data-do="help">ПРАВИЛА</button><button data-do="board">РЕЙТИНГ</button></div><button data-do="exit" class="op-quiet">В ХАБ</button><p>Три шара · Рекорд '+best+'</p>');hud();}
function resetTable(){for(const a of [bumpers,targets,standups,lanes])for(const o of a){o.cd=0;if('lit'in o)o.lit=false;if('flash'in o)o.flash=0;}for(const w of walls)w.cd=0;for(const f of flippers){f.angle=f.rest;f.omega=0;}spinner.velocity=0;spinner.angle=0;spinner.cd=0;spinner.flash=0;fx=[];trail=[];rush=0;ballSave=0;shake=0;}
function serve(savedBall=false){ball={x:301,y:465,vx:0,vy:0,lane:true};phase='ready';clearInput();trail=[];ballSave=savedBall?0:4;served++;say(savedBall?'ШАР СОХРАНЁН / ЗАПУСТИ СНОВА':'УДЕРЖИ ПАЛЕЦ НА ПОЛЕ И ОТПУСТИ',3);}
function start(){if(!ready)return;if(savedRun&&!savedRun.submitted)recordResult(savedRun.score,savedRun.clock);else if(['ready','play'].includes(phase))recordResult();savedRun=null;submitted=false;score=0;balls=3;multiplier=1;clock=0;served=0;paused=false;resetTable();hide();serve();remember();}
function beginCharge(){if(phase!=='ready'||paused||charging)return;charging=true;charge=0;}
function launch(){if(phase!=='ready'||paused)return false;ball.vy=-(540+Math.min(1,charge)*160);ball.vx=0;ball.lane=true;phase='play';charging=false;charge=0;say('ТРИ ОРБИТЫ → МНОЖИТЕЛЬ',2.5);beep(.7,.18,'triangle');remember();return true;}
function addScore(n){score+=Math.round(n*multiplier);best=Math.max(best,score);}
function burst(x,y,col,n=9){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=30+Math.random()*70;fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.3,c:col});}}
function drain(){if(phase!=='play')return;if(ballSave>0){burst(160,505,palettes[palette].edge,14);serve(true);remember();return;}balls--;beep(.1,.24,'triangle');if(balls>0){serve();remember();}else{phase='over';savedRun=null;recordResult();remember();modal('<p class="op-eyebrow">СИГНАЛ ПРИНЯТ</p><h3>'+String(score).padStart(6,'0')+'</h3><p>Смена окончена.<br>Рекорд '+best+' · Множитель ×'+multiplier+'</p><button data-do="start" class="op-primary">ЕЩЁ ТРИ ШАРА</button><button data-do="menu" class="op-quiet">МЕНЮ</button>');}}
function nearest(ax,ay,bx,by,x,y){const dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy||1)));return{x:ax+dx*t,y:ay+dy*t,t};}
function capsule(ax,ay,bx,by,r,restitution=.85,surfaceX=0,surfaceY=0){const p=nearest(ax,ay,bx,by,ball.x,ball.y),dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy),sum=R+r;if(d>=sum)return null;let nx,ny;if(d<.001){const l=Math.hypot(bx-ax,by-ay)||1;nx=-(by-ay)/l;ny=(bx-ax)/l;if((ball.vx-surfaceX)*nx+(ball.vy-surfaceY)*ny>0){nx*=-1;ny*=-1;}}else{nx=dx/d;ny=dy/d;}ball.x+=nx*(sum-d+.04);ball.y+=ny*(sum-d+.04);const vn=(ball.vx-surfaceX)*nx+(ball.vy-surfaceY)*ny;if(vn<0){ball.vx-=(1+restitution)*vn*nx;ball.vy-=(1+restitution)*vn*ny;}return{nx,ny,vn,t:p.t,x:p.x,y:p.y};}
function hitCircle(o,kick=0){const dx=ball.x-o.x,dy=ball.y-o.y,d=Math.hypot(dx,dy),sum=R+o.r;if(d>=sum)return false;const nx=d>.001?dx/d:0,ny=d>.001?dy/d:-1;ball.x=o.x+nx*(sum+.05);ball.y=o.y+ny*(sum+.05);const vn=ball.vx*nx+ball.vy*ny;if(vn<0){ball.vx-=1.85*vn*nx;ball.vy-=1.85*vn*ny;}if(kick&&o.cd<=0){const outward=ball.vx*nx+ball.vy*ny;if(outward<kick){ball.vx+=(kick-outward)*nx;ball.vy+=(kick-outward)*ny;}o.cd=.12;return true;}return false;}
function flipperStep(f,held,dt){const before=f.angle,target=held?f.raised:f.rest,delta=target-before,speed=held?14:8;f.angle+=Math.max(-speed*dt,Math.min(speed*dt,delta));f.omega=(f.angle-before)/dt;}
function flipperHit(f){const ex=f.x+Math.cos(f.angle)*f.len,ey=f.y+Math.sin(f.angle)*f.len,p=nearest(f.x,f.y,ex,ey,ball.x,ball.y),rx=p.x-f.x,ry=p.y-f.y;
 const result=capsule(f.x,f.y,ex,ey,5.7,.78,-f.omega*ry,f.omega*rx);if(result&&Math.abs(f.omega)>1&&result.vn<-20){burst(result.x,result.y,palettes[palette].gold,3);beep(.3,.035,'triangle');}}
function update(dt){if(paused||!['ready','play'].includes(phase))return;clock+=dt;toastT=Math.max(0,toastT-dt);shake=Math.max(0,shake-dt);rush=Math.max(0,rush-dt);for(const a of [bumpers,targets,standups,lanes])for(const o of a){o.cd=Math.max(0,o.cd-dt);if('flash'in o)o.flash=Math.max(0,o.flash-dt);}for(const w of walls)w.cd=Math.max(0,w.cd-dt);spinner.cd=Math.max(0,spinner.cd-dt);spinner.flash=Math.max(0,spinner.flash-dt);spinner.angle+=spinner.velocity*dt;spinner.velocity*=Math.pow(.2,dt);
 for(let i=0;i<2;i++)flipperStep(flippers[i],i===0?controls.left:controls.right,dt);
 for(const p of fx){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}fx=fx.filter(p=>p.life>0);
 if(phase==='ready'){if(charging)charge=Math.min(1,charge+dt/.95);return;}
 ballSave=Math.max(0,ballSave-dt);ball.vy+=285*dt;ball.vx*=Math.pow(.992,dt);ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
 if(ball.lane&&ball.y<89){ball.lane=false;const speed=Math.abs(ball.vy);ball.vx=-Math.min(280,130+speed*.2);ball.vy=-Math.min(210,70+speed*.24);burst(ball.x,ball.y,palettes[palette].edge,6);}
 for(const w of walls){const hit=capsule(w.ax,w.ay,w.bx,w.by,w.kind==='sling'?2.5:1,.87);if(hit&&w.kind==='sling'&&w.cd<=0&&hit.vn<0){ball.vx+=hit.nx*125;ball.vy+=hit.ny*125;w.cd=.18;addScore(10);burst(hit.x,hit.y,palettes[palette].pink,5);beep(.25,.06);}}
 for(const o of posts)hitCircle(o);
